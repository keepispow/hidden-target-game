function renderBoard(mode){
  let cells=''; for(let r=0;r<9;r++) for(let c=0;c<5;c++) cells+=renderCell(r,c,mode);
  return `<div class="board-wrap"><div class="board">${cells}</div></div>`;
}

function renderCell(r,c,mode){
  const classes=['cell']; if(r===4) classes.push('buffer');
  const piece = pieceAt(r,c); const trap = trapAt(r,c);
  let clickAttr=''; let inner='';

  if(mode==='target-pick'){
    const p=state.targetPicker; const backRow=p===1?8:0;
    if(r===backRow){ classes.push('pickable'); const chosen=state.players[p].target; if(chosen&&chosen.r===r&&chosen.c===c) classes.push('is-selected'); clickAttr=`data-action="pick-target" data-r="${r}" data-c="${c}"`; }
  } else if(mode==='place-piece'){
    if(isPlaceableTerritory(state.piecePlacer,r,c) && !piece && state.pendingPieceType){ classes.push('reachable'); clickAttr=`data-action="place-piece" data-r="${r}" data-c="${c}"`; }
  } else if(mode==='place-trap'){
    if(isPlaceableTerritory(state.trapPlacer,r,c) && !trap && state.pendingTrapType){ classes.push('reachable'); clickAttr=`data-action="place-trap" data-r="${r}" data-c="${c}"`; }
  } else if(mode==='main'){
    const pt = state.pendingTargeting;
    if(pt && (pt.kind==='readEnemySquare' || pt.kind==='placeNewTrap' || pt.kind==='reactivateSpentTrap')){
      const enemy = otherOf(state.active);
      let ok=false;
      if(pt.kind==='readEnemySquare') ok = isOwnTerritory(enemy,r,c);
      else ok = r!==4 && r!==0 && r!==8 && !trap && !isNearEnemyPiece(r,c,state.active);
      if(ok){ classes.push('reachable','target-mode'); clickAttr=`data-action="apply-target-square" data-r="${r}" data-c="${c}"`; }
    } else if(pt && pt.kind==='revealEnemyPieceType'){
      if(piece && piece.owner!==state.active){ classes.push('reachable','target-mode'); clickAttr=`data-action="apply-target-enemy-piece" data-id="${piece.id}"`; }
    } else if(!pt && state.selected){
      const reach = computeReachable(state.selected);
      const hit = reach.find(x=>x.r===r&&x.c===c);
      if(hit){ classes.push('reachable'); clickAttr=`data-action="move-to" data-r="${r}" data-c="${c}"`; }
    }
    if(!pt){
      if(piece && piece.owner===state.active && !piece.hasActed && !(piece.frozenTurns>0)){
        classes.push('clickable-piece'); clickAttr=`data-action="select-piece" data-id="${piece.id}"`;
        if(state.selected && state.selected.id===piece.id) classes.push('is-selected');
      } else if(piece && state.selected && state.selected.id===piece.id){ classes.push('is-selected'); }
    } else if(pt && ['pieceStat','pieceTempHp','pieceNextCombatAtk','pieceNextCombatEnemyDebuff','pieceSaveOnce','pieceDestroyAfterCombat','pieceRetreat','pieceIgnoreImmobilize','pieceIgnoreDebuffNextCombat'].includes(pt.kind)){
      if(piece && piece.owner===state.active){
        let ok=true;
        if(pt.filter==='large' && piece.type!=='large') ok=false;
        if(pt.filter==='hpLE2' && piece.hp>2) ok=false;
        if(ok){ classes.push('reachable','target-mode'); clickAttr=`data-action="apply-target-piece" data-id="${piece.id}"`; }
      }
    }
    if(state.showOwnTarget){
      const viewer = isOnline() ? myPlayer() : state.active;
      const myT=state.players[viewer].target; if(myT&&myT.r===r&&myT.c===c) classes.push('is-target-own');
    }
  }

  if(piece){
    const frozenCls = piece.frozenTurns>0 ? 'frozen':'';
    const pulse = state.fxPulses.find(p=>p.pieceId===piece.id);
    const pulseCls = pulse ? `fx-${pulse.kind}` : '';
    let known;
    if(mode==='main'){
      const viewer = isOnline() ? myPlayer() : state.active;
      known = piece.owner===viewer || piece.typeKnown;
    }
    else if(mode==='place-piece') known = piece.owner===state.piecePlacer;
    else if(mode==='place-trap') known = piece.owner===state.trapPlacer;
    else known = true;
    const sizeCls = known ? `sz-${PIECE_TYPES[piece.type].size}` : 'sz-unknown';
    // 種類不明の敵駒はHPを隠して「？」表示（種類推測を防ぐ）
    const displayVal = known ? piece.hp : '?';
    inner += `<div class="piece owner-${piece.owner} ${sizeCls} ${piece.hasActed?'acted':''} ${frozenCls} ${pulseCls}">${displayVal}</div>`;
  }
  const fxHere = state.fx.filter(f=>f.r===r && f.c===c);
  fxHere.forEach(f=>{ inner += `<div class="fx-float ${f.kind}">${escapeHtml(f.text)}</div>`; });
  if(trap){
    let show=false, mine=false, targetable=false;
    const pt = state.pendingTargeting;
    if(mode==='place-trap'){ show = trap.owner===state.trapPlacer; mine=true; }
    else if(mode==='main'){
      const forcedByTargeting = pt && pt.kind==='trapModify' && trap.owner===state.active &&
        (!pt.ops.trapFilter || trap.type===pt.ops.trapFilter) &&
        (!pt.ops.needUnrevealed || !trap.revealed) && (!pt.ops.needRevealed || trap.revealed);
      show = trap.revealed || forcedByTargeting || (trap.owner===(isOnline()?myPlayer():state.active) && state.showOwnTraps);
      mine = !trap.revealed; targetable = !!forcedByTargeting;
    } else { show = trap.revealed; }
    if(show){
      const clickA = targetable ? `data-action="apply-target-trap" data-id="${trap.id}"` : ((mode==='main'&&trap.revealed)?`data-action="toggle-trap" data-id="${trap.id}"`:'');
      inner += `<div class="trap-mark ${trap.revealed?'revealed':''} ${mine&&!trap.revealed?'mine':''} ${targetable?'targetable':''}" ${clickA} title="${TRAP_TYPES[trap.type].label}">${TRAP_TYPES[trap.type].badge}</div>`;
    }
  }
  // 右クリック用に常に座標を付与
  const coordAttr = `data-r="${r}" data-c="${c}"`;
  return `<div class="${classes.join(' ')}" ${coordAttr} ${clickAttr}>${inner}</div>`;
}

function renderMain(){
  // オンラインは常に自分視点の手札。ローカルは手番プレイヤー視点
  const viewer = isOnline() ? myPlayer() : state.active;
  const active = state.players[state.active];
  const me = state.players[viewer];
  const opp = state.players[otherOf(viewer)];
  const sel = state.selected;
  const cap = actedCount(state.active);
  const pieceLimit = 3;
  const cardLimit = 3 + (active.bonusCardsThisTurn||0);

  let banner = '';
  if(state.infoReveal){
    const ir = state.infoReveal;
    banner = `<div class="action-banner"><div class="ab-title">${escapeHtml(ir.title)}</div>
      <div class="ab-effect">${ir.lines.map(l=>escapeHtml(l)).join('<br>')}</div>

      <button class="btn small primary${ir.owner===2?' p2':''}" data-action="dismiss-info-reveal">確認した（閉じる）</button></div>`;
  } else if(state.currentInterrupt){
    const iv = state.currentInterrupt;
    const msg = iv.type==='chain' ? '「戦闘継続」を使いますか?(この駒でもう一度行動できます)' : '「反撃」を使いますか?(相手の駒に1ダメージ)';
    banner = `<div class="action-banner"><div class="ab-title">${ownerLabel(iv.owner)}への確認</div><div class="ab-effect">${escapeHtml(msg)}</div>
      <div class="row"><button class="btn small primary${iv.owner===2?' p2':''}" data-action="interrupt-yes">使う</button><button class="btn small ghost" data-action="interrupt-no">使わない</button></div></div>`;
  } else if(state.pendingTargeting){
    const pt = state.pendingTargeting;
    if(pt.kind==='supplyBury'){
      banner = `<div class="action-banner"><div class="ab-title">${escapeHtml(pt.cardName)}</div><div class="ab-effect">山札の一番下に戻すカードを、下の手札一覧からタップして選んでください</div></div>`;
    } else {
      let howTo = '盤面の対象(緑の枠)をタップしてください';
      if(pt.kind==='trapModify') howTo = '対象になる自分の罠(緑の枠)をタップしてください。自分の罠を表示していなくても対象は光ります';
      if(pt.kind==='reactivateSpentTrap'){
        const spent = state.players[state.active].spentTraps[pt.spentIndex];
        const tname = spent ? TRAP_TYPES[spent.type].label : '?';
        howTo = `直近の発動済み「${tname}」罠を、緑の枠のマスに再設置してください`;
      }
      if(pt.kind==='placeNewTrap') howTo = '罠を設置するマス(緑の枠)をタップしてください';
      banner = `<div class="action-banner"><div class="ab-title">${escapeHtml(pt.cardName)}</div><div class="ab-effect">${escapeHtml(pt.cardEffect)}<br>${howTo}</div>
        <button class="btn small ghost" data-action="cancel-targeting">キャンセル</button></div>`;
    }
  } else if(state.manualBanner){
    banner = `<div class="action-banner"><div class="ab-title">${escapeHtml(state.manualBanner.name)}(手動適用)</div><div class="ab-effect">${escapeHtml(state.manualBanner.effect)}<br>選択中の駒パネルのHP/最大HP/攻撃力ボタンで、この内容を手動で反映してください。</div>
      <button class="btn small ghost" data-action="dismiss-banner">閉じる</button></div>`;
  }

  const statusBar = `<div class="status-bar spread">
    <div><span class="who ${state.active===1?'p1':'p2'}">${ownerLabel(state.active)}</span> のターン ・ 第${state.turn}ターン</div>
    <div class="muted">行動済み駒 <span class="${cap>=pieceLimit?'cap full':''}">${cap}/${pieceLimit}</span>　使用カード ${state.cardsUsedThisTurn}/${cardLimit}</div></div>`;

  let detail = `<div class="card-box"><div class="section-title">選択中の駒</div><p class="muted tiny">盤面の自分の駒(未行動)をタップすると、ここに詳細が出ます</p></div>`;
  if(sel){
    const badges=[];
    if(sel.pendingNextCombatAtkBonus) badges.push(`次戦闘ATK+${sel.pendingNextCombatAtkBonus}`);
    if(sel.pendingEnemyAtkDebuff) badges.push(`次戦闘相手ATK-${sel.pendingEnemyAtkDebuff}`);
    if(sel.pendingExtraDamageTaken) badges.push(`次戦闘被ダメ+${sel.pendingExtraDamageTaken}${(sel.debuffCombatCharges||0)>1?`×${sel.debuffCombatCharges}`:''}`);
    if(sel.ignoreDebuffNextCombat) badges.push('デバフ無視(次戦闘)');
    if(sel.saveOnce) badges.push('防衛線(1回無効化)');
    if(sel.destroyAfterNextCombat) badges.push('戦闘後に撃破予定');
    if(sel.frozenTurns>0) badges.push('凍結中');
    detail = `<div class="card-box piece-detail"><div class="spread"><div class="section-title" style="margin:0;">${ownerLabel(sel.owner)} ${PIECE_TYPES[sel.type].label}</div><button class="btn small ghost" data-action="deselect">選択解除</button></div>
      <div class="stat-row"><span class="lbl">HP</span><div class="stepper"><button data-action="adj-hp" data-id="${sel.id}" data-delta="-1">−</button><span class="val">${sel.hp}/${sel.maxHp}</span><button data-action="adj-hp" data-id="${sel.id}" data-delta="1">+</button></div></div>
      <div class="stat-row"><span class="lbl">最大HP</span><div class="stepper"><button data-action="adj-maxhp" data-id="${sel.id}" data-delta="-1">−</button><span class="val">${sel.maxHp}</span><button data-action="adj-maxhp" data-id="${sel.id}" data-delta="1">+</button></div></div>
      <div class="stat-row"><span class="lbl">攻撃力</span><div class="stepper"><button data-action="adj-atk" data-id="${sel.id}" data-delta="-1">−</button><span class="val">${sel.atk}</span><button data-action="adj-atk" data-id="${sel.id}" data-delta="1">+</button></div></div>
      ${badges.length?`<div class="flag-badges">${badges.map(b=>`<span class="pill">${escapeHtml(b)}</span>`).join('')}</div>`:''}
      <div class="row"><button class="btn small ghost" data-action="toggle-acted" data-id="${sel.id}">${sel.hasActed?'再行動可能にする':'行動済みにする'}</button><button class="btn small ghost" data-action="destroy-piece" data-id="${sel.id}">手動で撃破</button></div>
    </div>`;
  }

  const myTurn = viewer===state.active;
  const handCards = me.hand.map(c=>{
    const isBuryPick = myTurn && state.pendingTargeting && state.pendingTargeting.kind==='supplyBury';
    const blocked = !myTurn || state.pendingTargeting || state.currentInterrupt;
    const p2cls = viewer===2?' p2':'';
    const isUsed = !!c.usedThisTurn;
    let useBtn = '';
    if(isBuryPick){
      useBtn = isUsed ? '' : `<button class="btn small primary${p2cls}" data-action="resolve-bury" data-id="${c.uid}">これを戻す</button>`;
    } else if(!blocked && !isUsed){
      useBtn = `<button class="btn small primary${p2cls}" data-action="use-card" data-id="${c.uid}">使用</button>`;
    }
    const hideBtn = (blocked || isUsed) ? '' : `<button class="btn small ghost" data-action="toggle-hidden" data-player="${viewer}" data-id="${c.uid}">${c.faceDown?'公開する':'伏せる'}</button>`;
    let badge = '';
    if(isUsed) badge = `<span class="pill" style="color:var(--danger);border-color:var(--danger);">使用済・伏せ</span>`;
    else if(c.faceDown) badge = `<span class="pill" style="color:var(--warn);border-color:var(--warn);">伏せ中</span>`;
    return `<div class="hand-card${isUsed?' readonly':''}"><div class="hc-top"><span class="hc-name">${escapeHtml(c.name)}</span><span class="pill">${escapeHtml(c.cat)}${c.interrupt?'・割込':''}</span>${badge}</div>
      <div class="hc-effect">${escapeHtml(c.effect)}</div><div class="hc-actions">${hideBtn}${useBtn}</div></div>`;
  }).join('') || `<p class="muted tiny" style="grid-column:1/-1;">手札がありません</p>`;

  const oppHandCards = opp.hand.map(c=> c.faceDown
    ? `<div class="hand-card readonly"><div class="hc-top"><span class="hc-name">🂠 伏せ</span><span class="pill">非公開</span></div></div>`
    : `<div class="hand-card readonly"><div class="hc-top"><span class="hc-name">${escapeHtml(c.name)}</span><span class="pill">${escapeHtml(c.cat)}</span></div><div class="hc-effect">${escapeHtml(c.effect)}</div></div>`
  ).join('') || '<p class="muted tiny" style="grid-column:1/-1;">手札なし</p>';

  const logHtml = state.log.map(l=>`<div class="entry">${escapeHtml(l)}</div>`).join('');

  return `${banner}${statusBar}
    <div class="game-layout">
      <div class="board-col">${renderBoard('main')}
        <div class="row" style="justify-content:center;">
          <button class="btn small ghost" data-action="toggle-own-traps">${state.showOwnTraps?'自分の罠を隠す':'自分の罠を表示'}</button>
          <button class="btn small ghost" data-action="toggle-own-target">${state.showOwnTarget?'自分の的を隠す':'自分の的を確認'}</button>
        </div>
        <button class="btn primary ${state.active===2?'p2':''}" data-action="request-end-turn" style="width:100%;max-width:360px;">ターン終了</button>
      </div>
      <div class="side-col">
        ${detail}
        <div class="card-box"><div class="spread"><div class="section-title" style="margin:0;">手札(${ownerLabel(viewer)}) ・ 伏せ${hiddenCount(viewer)}/3 ・ 山札${me.deck.length} ・ 捨札${me.discard.length}</div><button class="btn small ghost" data-action="toggle-discard">${state.showDiscard?'捨札を隠す':'捨札を見る'}</button></div>
          ${state.showDiscard ? `<div class="discard-list">${me.discard.length? me.discard.slice().reverse().map(d=>d.faceDown?`<span class="pill">🂠 伏せ</span>`:`<span class="pill">${escapeHtml(d.name)}</span>`).join(''):'<span class="muted tiny">捨札なし</span>'}</div>`:''}
          <div class="hand-list">${handCards}</div></div>
        <div class="card-box"><div class="section-title">相手の手札(${ownerLabel(otherOf(viewer))}) ・ ${opp.hand.length}枚</div><div class="hand-list">${oppHandCards}</div></div>
        <div class="card-box"><div class="section-title">ログ</div><div class="log-panel">${logHtml}</div></div>
      </div>
    </div>`;
}

/* =========================================================
   EVENTS
========================================================= */
app.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const r = el.dataset.r!==undefined?parseInt(el.dataset.r,10):null;
  const c = el.dataset.c!==undefined?parseInt(el.dataset.c,10):null;
  const id = el.dataset.id;
  const delta = el.dataset.delta!==undefined?parseInt(el.dataset.delta,10):null;
  const type = el.dataset.type;

  // ネット専用アクション（ローカルで処理）
  if(action==='open-online-setup'){
    state.net.setupOpen = true;
    render();
    return;
  }
  if(action==='close-online-setup'){
    state.net.setupOpen = false;
    render();
    return;
  }
  if(action==='net-create'){
    const inp = document.querySelector('[data-online-name]');
    state.names[1] = sanitizeName(inp ? inp.value : state.net.playerName);
    createRoom();
    return;
  }
  if(action==='net-join'){
    const nameInp = document.querySelector('[data-online-name]');
    state.names[2] = sanitizeName(nameInp ? nameInp.value : state.net.playerName);
    const inp = document.querySelector('[data-join-code]');
    const code = inp ? inp.value : (state.net && state.net.joinCode);
    joinRoom(code);
    return;
  }
  if(action==='net-cancel'){
    destroyNet();
    state.net = { mode:'local', role:null, localPlayer:1, roomCode:'', status:'idle', errorMsg:'', joinCode:'' };
    render();
    return;
  }

  // ゲストはゲーム操作をホストへ転送（UI系はローカル可）
  const localOnly = new Set(['toggle-mute','open-reference','close-reference','toggle-discard','close-cell-info','cell-info-keep','toggle-own-traps','toggle-own-target','net-create','net-join','net-cancel']);
  if(isGuest() && state.net.status==='connected' && !localOnly.has(action)){
    if(!canLocalAct() && !['dismiss-info-reveal','interrupt-yes','interrupt-no','cancel-targeting','dismiss-banner'].includes(action)){
      toast('今は相手の番です');
      return;
    }
    sendActionToHost({ action, r, c, id, delta, type, player: el.dataset.player?parseInt(el.dataset.player,10):null });
    return;
  }
  if(isOnline() && state.net.status==='connected' && isHost() && !localOnly.has(action) && !canLocalAct()){
    // ホストでも自分の番でなければ操作しない（相手の駒など）
    if(!['dismiss-info-reveal','interrupt-yes','interrupt-no','cancel-targeting','dismiss-banner','toggle-own-traps','toggle-own-target'].includes(action)){
      toast('今は相手の番です');
      return;
    }
  }

  switch(action){
    case 'start': {
      // 入力欄の最新値を確定（未同期の場合に備える）
      document.querySelectorAll('[data-name-player]').forEach(inp=>{
        const pn = parseInt(inp.dataset.namePlayer,10);
        state.names[pn] = sanitizeName(inp.value);
      });
      if(isOnline() && isHost() && state.net.status!=='connected'){
        toast('相手の入室を待ってから開始してください');
        return;
      }
      if(isOnline()) state.net.mode = 'online';
      else { state.net.mode = 'local'; state.net.localPlayer = 1; }
      doCoinflip();
      break;
    }
    case 'coinflip-next': afterCoinflip(); break;
    case 'gate-ready': gateReady(); break;
    case 'handoff-ready': handoffReady(); break;
    case 'pick-target': pickTarget(r,c); break;
    case 'set-piece-type': setPendingPieceType(el.dataset.type); break;
    case 'place-piece': placePiece(r,c); break;
    case 'set-trap-type': setPendingTrapType(el.dataset.type); break;
    case 'place-trap': placeTrap(r,c); break;
    case 'select-piece': selectPieceById(id); break;
    case 'move-to': moveSelectedTo(r,c); break;
    case 'deselect': state.selected=null; render(); break;
    case 'adj-hp': adjustPieceStat(id,'hp',delta); break;
    case 'adj-maxhp': adjustPieceStat(id,'maxHp',delta); break;
    case 'adj-atk': adjustPieceStat(id,'atk',delta); break;
    case 'destroy-piece': destroyPieceById(id); break;
    case 'toggle-acted': toggleActed(id); break;
    case 'use-card': {
      const pl = state.players[state.active];
      const card = pl.hand.find(c=>c.uid===id);
      if(card && card.apply && ['drawCards','conditionalDraw','supplyDraw','reserveExtraPlay'].includes((Array.isArray(card.apply)?card.apply[0]:card.apply).kind)) applyImmediateCardWithDrawFlow(id);
      else useCard(id);
      break;
    }
    case 'resolve-bury': resolveBury(id); break;
    case 'apply-target-piece': resolveApplyPieceTarget(id); break;
    case 'apply-target-enemy-piece': resolveApplyEnemyPieceTarget(id); break;
    case 'apply-target-square': resolveApplySquareTarget(r,c); break;
    case 'apply-target-trap': resolveApplyTrapTarget(id); break;
    case 'cancel-targeting': cancelTargeting(); break;
    case 'interrupt-yes': resolveInterrupt(true); break;
    case 'interrupt-no': resolveInterrupt(false); break;
    case 'dismiss-banner': dismissManualBanner(); break;
    case 'dismiss-info-reveal': state.infoReveal=null; render(); break;
    case 'request-end-turn': requestEndTurn(); break;
    case 'confirm-end-turn': endTurn(); break;
    case 'cancel-end-turn': cancelEndTurn(); break;
    case 'turn-start-ready': turnStartReady(); break;
    case 'toggle-own-traps': state.showOwnTraps=!state.showOwnTraps; render(); break;
    case 'toggle-own-target': state.showOwnTarget=!state.showOwnTarget; render(); break;
    case 'toggle-trap': toggleTrapRevealed(id); break;
    case 'restart': destroyNet(); newGame(true); render(); break;
    case 'toggle-mute': state.muted=!state.muted; if(!state.muted) playTone(660,0.08,'sine',0.1); render(); break;
    case 'open-reference': state.showReference=true; render(); break;
    case 'close-reference': state.showReference=false; render(); break;
    case 'toggle-discard': state.showDiscard=!state.showDiscard; render(); break;
    case 'toggle-hidden': toggleCardHidden(parseInt(el.dataset.player,10), id); break;
    case 'confirm-hand-hide': confirmHandHide(); break;
    case 'close-cell-info': state.cellInfo=null; render(); break;
    case 'cell-info-keep': break; // パネル内クリックでは閉じない
  }
});

/* 長押しでマス情報（スマホ向け） */
let longPressTimer = null;
let longPressMoved = false;
let longPressFired = false;
function clearLongPress(){
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
}
function startLongPress(e, clientX, clientY){
  const cell = e.target.closest('.cell');
  if(!cell || cell.dataset.r===undefined) return;
  longPressMoved = false;
  longPressFired = false;
  const startX = clientX, startY = clientY;
  clearLongPress();
  longPressTimer = setTimeout(()=>{
    longPressTimer = null;
    if(longPressMoved) return;
    longPressFired = true;
    const r = parseInt(cell.dataset.r,10);
    const c = parseInt(cell.dataset.c,10);
    showCellInfo(r,c);
  }, 480);
  const onMove = (ev)=>{
    const pt = ev.touches ? ev.touches[0] : ev;
    if(!pt) return;
    if(Math.abs(pt.clientX-startX)>12 || Math.abs(pt.clientY-startY)>12){
      longPressMoved = true;
      clearLongPress();
    }
  };
  const onEnd = ()=>{
    clearLongPress();
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
    document.removeEventListener('touchcancel', onEnd);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
  };
  document.addEventListener('touchmove', onMove, {passive:true});
  document.addEventListener('touchend', onEnd);
  document.addEventListener('touchcancel', onEnd);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
}
app.addEventListener('touchstart', e=>{
  if(!e.touches || !e.touches[0]) return;
  startLongPress(e, e.touches[0].clientX, e.touches[0].clientY);
}, {passive:true});
app.addEventListener('mousedown', e=>{
  if(e.button!==0) return;
  // 右クリックは contextmenu 側で処理
  startLongPress(e, e.clientX, e.clientY);
});
// 長押し発火直後のクリックで駒選択などが走らないようにする
app.addEventListener('click', e=>{
  if(longPressFired){
    longPressFired = false;
    e.stopPropagation();
    e.preventDefault();
  }
}, true);

    return;
  }
  const joinInp = e.target.closest('[data-join-code]');
  if(joinInp){
    state.net.joinCode = String(joinInp.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
    if(joinInp.value !== state.net.joinCode) joinInp.value = state.net.joinCode;
    return;
  }
  const inp = e.target.closest('[data-name-player]');
  if(!inp) return;
  const pn = parseInt(inp.dataset.namePlayer,10);
  const cleaned = sanitizeName(inp.value);
  if(cleaned !== inp.value){
    const pos = inp.selectionStart;
    inp.value = cleaned;
    try{ inp.setSelectionRange(Math.min(pos, cleaned.length), Math.min(pos, cleaned.length)); }catch(_){}
  }
  state.names[pn] = cleaned;
});

/* =========================================================
   INIT
========================================================= */
try{
  newGame();
  render();
}catch(err){
  console.error(err);
  const appEl = document.getElementById('app');
  if(appEl){
    appEl.innerHTML = '<div style="color:#E7EBF0;padding:24px;font-family:-apple-system,sans-serif;line-height:1.6;max-width:420px;margin:40px auto;">'
      + '<h2 style="color:#E8574A;">起動エラー</h2>'
      + '<p>ゲームの読み込みに失敗しました。</p>'
      + '<p style="color:#8D96A6;font-size:0.9rem;">' + String(err && err.message || err) + '</p>'
      + '<p style="color:#8D96A6;font-size:0.85rem;margin-top:16px;">iPhoneの場合、<b>ファイルアプリから直接開く</b>と動作しないことが多いです。PCで簡易サーバーを立てるか、ネット上に置いたURLをSafariで開いてください。</p>'
      + '</div>';
  }
}
</script>
