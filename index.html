<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>手札全開示ゲーム — 対戦盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12161D; --bg-panel:#1A2029; --bg-raised:#212836; --bg-raised2:#293142;
  --border:#2A3340; --border-strong:#3C4757;
  --text:#E7EBF0; --text-muted:#8D96A6; --text-dim:#5C6472;
  --p1:#4FD1D9; --p1-soft:#1E4A4E; --p1-ink:#082022;
  --p2:#E8A33D; --p2-soft:#4F3A18; --p2-ink:#241A08;
  --danger:#E8574A; --success:#6FCF97; --warn:#E8C93D;
  --font-body:'Noto Sans JP', system-ui, -apple-system, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  --radius:8px; --radius-sm:4px;
}
:root:not([data-theme="light"]){ color-scheme: dark; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; min-height:100%; }
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  min-height:100vh; padding:18px 14px 60px; line-height:1.6;
  -webkit-tap-highlight-color: transparent;
}
h1,h2,h3{ font-weight:900; letter-spacing:.01em; margin:0; }
button{ font-family:inherit; }
#app{ max-width:960px; margin:0 auto; }
.btn{
  font-family:var(--font-body); font-weight:700; font-size:.92rem;
  padding:11px 20px; border-radius:999px; border:1px solid var(--border-strong);
  background:var(--bg-raised); color:var(--text); cursor:pointer;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
  touch-action:manipulation;
}
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--p1); color:var(--p1-ink); border-color:var(--p1); }
.btn.primary.p2{ background:var(--p2); color:var(--p2-ink); border-color:var(--p2); }
.btn.ghost{ background:transparent; }
.btn.small{ padding:7px 13px; font-size:.8rem; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.btn:focus-visible, .cell:focus-visible{ outline:2px solid var(--warn); outline-offset:2px; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.spread{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.muted{ color:var(--text-muted); font-size:.85rem; }
.tiny{ font-size:.75rem; }
.pill{
  display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px;
  font-size:.72rem; font-weight:700; background:var(--bg-raised2); color:var(--text-muted);
  border:1px solid var(--border-strong);
}
.pill.p1{ color:var(--p1); border-color:var(--p1-soft); }
.pill.p2{ color:var(--p2); border-color:var(--p2-soft); }
.card-box{ background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }

.title-screen{ min-height:78vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:22px; padding:20px 0; }
.title-grid{ display:grid; grid-template-columns:repeat(5,14px); grid-template-rows:repeat(9,14px); gap:3px; opacity:.9; }
.title-grid span{ background:var(--bg-raised); border-radius:2px; }
.title-grid span.mark{ background:var(--p2); box-shadow:0 0 10px var(--p2); }
.title-screen h1{ font-size:2.15rem; line-height:1.25; }
.title-screen .subtitle{ color:var(--text-muted); font-size:.95rem; max-width:420px; }
.title-desc{ max-width:440px; color:var(--text-muted); font-size:.88rem; }
.name-form{ display:flex; flex-direction:column; gap:12px; width:min(100%,320px); text-align:left; }
.name-row{ display:flex; flex-direction:column; gap:4px; }
.name-row label{ font-size:.78rem; font-weight:700; color:var(--text-muted); }
.name-row label .who-tag{ margin-left:4px; }
.name-row input{
  font-family:var(--font-body); font-size:1rem; font-weight:700;
  padding:11px 14px; border-radius:var(--radius); border:1px solid var(--border-strong);
  background:var(--bg-raised); color:var(--text); width:100%;
  outline:none; transition:border-color .15s ease;
}
.name-row input:focus{ border-color:var(--warn); }
.name-row input.p1-focus:focus{ border-color:var(--p1); }
.name-row input.p2-focus:focus{ border-color:var(--p2); }
.name-hint{ font-size:.72rem; color:var(--text-dim); text-align:center; }

.coin-screen{ min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; text-align:center; }
.coin-dial{
  width:130px; height:130px; border-radius:50%; border:3px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono);
  font-size:2rem; font-weight:700; background:var(--bg-panel); position:relative;
}
.coin-dial.spin{ animation:spin 1.3s cubic-bezier(.2,.9,.3,1); }
@keyframes spin{ 0%{ transform:rotate(0deg); } 100%{ transform:rotate(1080deg); } }
.coin-dial.result-1{ border-color:var(--p1); color:var(--p1); box-shadow:0 0 24px -6px var(--p1); }
.coin-dial.result-2{ border-color:var(--p2); color:var(--p2); box-shadow:0 0 24px -6px var(--p2); }

.gate{ min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
.gate-icon{ font-size:2.4rem; }
.gate-msg{ max-width:380px; color:var(--text); font-size:1rem; }
.gate-msg b{ color:var(--warn); }

.board-wrap{ display:flex; justify-content:center; }
.board{
  display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(9,1fr);
  gap:3px; width:min(84vw,360px); aspect-ratio:5/9;
  background:var(--border); border:2px solid var(--border-strong); border-radius:var(--radius);
  padding:3px;
}
.cell{ position:relative; background:var(--bg-panel); border-radius:3px; display:flex; align-items:center; justify-content:center; transition:background .12s ease; }
.cell.buffer{ background:repeating-linear-gradient(135deg,var(--bg-panel) 0 6px,var(--bg-raised) 6px 12px); }
.cell.pickable, .cell.reachable{ background:var(--bg-raised2); box-shadow:inset 0 0 0 2px var(--success); cursor:pointer; }
.cell.pickable:hover, .cell.reachable:hover{ background:var(--border-strong); }
.cell.target-mode{ box-shadow:inset 0 0 0 2px var(--warn); }
.cell.clickable-piece{ cursor:pointer; }
.cell.is-selected{ box-shadow:inset 0 0 0 2px #fff; }
.cell.is-target-own{ box-shadow:inset 0 0 0 2px var(--warn); }
.piece{ width:70%; height:70%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; user-select:none; line-height:1; }
.piece.owner-1{ background:var(--p1); color:var(--p1-ink); }
.piece.owner-2{ background:var(--p2); color:var(--p2-ink); }
.piece.sz-1{ width:44%; height:44%; border-radius:50%; font-size:.62rem; }
.piece.sz-2{ width:62%; height:62%; border-radius:7px; font-size:.72rem; }
.piece.sz-3{ width:80%; height:80%; border-radius:7px; clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%); font-size:.82rem; }
.piece.sz-unknown{ width:58%; height:58%; border-radius:6px; font-size:.68rem; }
.piece.acted{ opacity:.4; }
.piece.frozen{ outline:2px dashed var(--danger); }
.trap-mark{ position:absolute; top:2px; right:2px; width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.58rem; font-weight:700; font-family:var(--font-mono); background:var(--bg); border:1px solid var(--border-strong); color:var(--text-muted); }
.trap-mark.revealed{ background:var(--danger); border-color:var(--danger); color:#1a0503; cursor:pointer; }
.trap-mark.mine{ border-color:var(--warn); color:var(--warn); }
.trap-mark.targetable{ box-shadow:0 0 0 2px var(--success); cursor:pointer; }

.type-picker{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.type-chip{ background:var(--bg-panel); border:1px solid var(--border-strong); border-radius:var(--radius); padding:9px 14px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.78rem; color:var(--text-muted); min-width:64px; }
.type-chip.active{ border-color:var(--warn); color:var(--warn); background:var(--bg-raised2); }
.type-chip:disabled{ opacity:.3; cursor:not-allowed; }
.type-chip b{ font-family:var(--font-mono); font-size:1rem; color:var(--text); }
.type-chip.active b{ color:var(--warn); }

.status-bar{ background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px; margin-bottom:12px; font-size:.85rem; }
.status-bar .who{ font-weight:700; font-family:var(--font-mono); }
.status-bar .who.p1{ color:var(--p1); } .status-bar .who.p2{ color:var(--p2); }
.status-bar .cap.full{ color:var(--danger); font-weight:700; }
.game-layout{ display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
.board-col{ flex:0 0 auto; display:flex; flex-direction:column; gap:10px; align-items:center; }
.side-col{ flex:1 1 300px; min-width:270px; max-width:380px; display:flex; flex-direction:column; gap:10px; }
.section-title{ font-size:.78rem; font-weight:700; color:var(--text-muted); margin-bottom:8px; }
.piece-detail{ display:flex; flex-direction:column; gap:8px; }
.stat-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.stat-row .lbl{ font-size:.8rem; color:var(--text-muted); width:64px; }
.stepper{ display:flex; align-items:center; gap:8px; }
.stepper button{ width:28px; height:28px; border-radius:50%; border:1px solid var(--border-strong); background:var(--bg-raised); color:var(--text); font-size:1rem; line-height:1; cursor:pointer; }
.stepper .val{ font-family:var(--font-mono); font-weight:700; min-width:28px; text-align:center; }
.flag-badges{ display:flex; flex-wrap:wrap; gap:4px; }

.hand-list{
  display:grid; grid-template-columns:repeat(3, 1fr); grid-auto-rows:minmax(150px, auto);
  gap:8px; max-height:none; overflow:visible; align-items:stretch;
}
.hand-card{
  background:var(--bg-raised); border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  padding:10px 9px; display:flex; flex-direction:column; min-width:0; min-height:150px;
}
.hand-card.readonly{ opacity:.85; }
.hand-card .hc-top{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
.hand-card .hc-name{ font-weight:700; font-size:.82rem; line-height:1.3; word-break:break-word; }
.hand-card .hc-effect{
  font-size:.72rem; color:var(--text-muted); margin-top:6px; line-height:1.45;
  flex:1 1 auto; overflow:visible;
}
.hand-card .hc-actions{ display:flex; flex-wrap:wrap; gap:4px; margin-top:auto; padding-top:8px; justify-content:flex-end; }
.hand-card .hc-actions .btn.small{ padding:5px 8px; font-size:.7rem; }

.log-panel{ max-height:170px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:5px; }
.log-panel .entry{ font-size:.74rem; color:var(--text-muted); border-left:2px solid var(--border-strong); padding-left:7px; }

.toast{ position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:var(--bg-raised2); border:1px solid var(--warn); color:var(--text); padding:11px 16px; border-radius:var(--radius); max-width:88vw; font-size:.84rem; box-shadow:0 10px 30px -10px rgba(0,0,0,.6); z-index:50; text-align:center; }

.action-banner{ position:sticky; top:8px; z-index:30; background:var(--bg-raised2); border:2px solid var(--warn); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px; }
.action-banner .ab-title{ font-weight:700; color:var(--warn); font-size:.85rem; margin-bottom:4px; }
.action-banner .ab-effect{ font-size:.8rem; color:var(--text); margin-bottom:8px; }

.gameover-screen{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
.gameover-screen .win-who{ font-size:2.4rem; font-weight:900; font-family:var(--font-mono); }
.gameover-screen .win-who.p1{ color:var(--p1); } .gameover-screen .win-who.p2{ color:var(--p2); }

.fx-float{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-family:var(--font-mono); font-weight:900; font-size:.78rem; white-space:nowrap; pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.7); animation:fxFloat .9s ease-out forwards; z-index:5; }
.fx-float.buff{ color:var(--success); } .fx-float.damage{ color:var(--danger); } .fx-float.info{ color:var(--warn); } .fx-float.trap{ color:var(--p2); }
@keyframes fxFloat{ 0%{ opacity:0; transform:translate(-50%,-20%) scale(.7); } 18%{ opacity:1; transform:translate(-50%,-55%) scale(1.2); } 100%{ opacity:0; transform:translate(-50%,-170%) scale(1); } }
@keyframes pulseBuff{ 0%{ box-shadow:0 0 0 0 rgba(111,207,151,.95); } 100%{ box-shadow:0 0 0 16px rgba(111,207,151,0); } }
@keyframes pulseDamage{ 0%{ box-shadow:0 0 0 0 rgba(232,87,74,.95); } 100%{ box-shadow:0 0 0 16px rgba(232,87,74,0); } }
.piece.fx-buff{ animation:pulseBuff .6s ease-out; }
.piece.fx-damage{ animation:pulseDamage .6s ease-out; }
.mute-toggle{ position:fixed; top:10px; right:10px; z-index:40; width:38px; height:38px; border-radius:50%; border:1px solid var(--border-strong); background:var(--bg-panel); color:var(--text); font-size:1rem; cursor:pointer; }
.ref-toggle{ position:fixed; top:10px; right:56px; z-index:40; height:38px; padding:0 14px; border-radius:19px; border:1px solid var(--border-strong); background:var(--bg-panel); color:var(--text); font-size:.78rem; font-weight:700; cursor:pointer; }
.ref-overlay{ position:fixed; inset:0; background:rgba(8,10,14,.82); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:16px; overflow-y:auto; }
.ref-panel{ background:var(--bg-panel); border:1px solid var(--border-strong); border-radius:var(--radius); padding:16px; max-width:640px; width:100%; margin-top:20px; }
.discard-list{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.discard-list .pill{ cursor:default; }
.cell-info-overlay{ position:fixed; inset:0; background:rgba(8,10,14,.7); z-index:55; display:flex; align-items:center; justify-content:center; padding:16px; }
.cell-info-panel{ background:var(--bg-panel); border:1px solid var(--border-strong); border-radius:var(--radius); padding:16px; max-width:320px; width:100%; }
.cell-info-panel h3{ font-size:1rem; margin-bottom:8px; }
.cell-info-panel .info-row{ font-size:.85rem; margin:4px 0; color:var(--text-muted); }
.cell-info-panel .info-row b{ color:var(--text); }
@media (max-width:720px){
  .game-layout{ flex-direction:column; align-items:center; }
  .side-col{ max-width:420px; width:100%; }
}
</style>
</head>
<body>
<div id="app"><p style="color:#8D96A6;text-align:center;padding:40px 16px;font-family:-apple-system,sans-serif;">読み込み中…<br><span style="font-size:0.85rem;">しばらく真っ黒のままなら、Safariで開き直すか、PCからURLで配信してください。</span></p></div>
<noscript><p style="color:#E8574A;text-align:center;padding:40px;">このゲームにはJavaScriptが必要です。Safariの設定でJSを有効にしてください。</p></noscript>
<script>
/* =========================================================
   DATA
========================================================= */
const PIECE_TYPES = {
  small:  { label:'小駒', hp:2, atk:1, count:3, size:1 },
  medium: { label:'中駒', hp:4, atk:3, count:2, size:2 },
  large:  { label:'大駒', hp:6, atk:5, count:1, size:3 },
};
const TRAP_TYPES = {
  damage: { label:'ダメージ', badge:'ダ' },
  debuff: { label:'デバフ',   badge:'デ' },
  info:   { label:'情報',     badge:'情' },
  draw:   { label:'ドロー',   badge:'ド' },
};
/* apply.kind vocabulary:
   pieceStat, pieceTempHp, pieceNextCombatAtk, pieceNextCombatEnemyDebuff,
   pieceExtraDamageTaken, pieceSaveOnce, pieceDestroyAfterCombat, pieceRetreat,
   pieceIgnoreImmobilize, pieceIgnoreDebuffNextCombat,
   drawCards, conditionalDraw, supplyDraw, reserveExtraPlay,
   revealRandomOpponentCard, revealDeckTrapTypes, revealTargetHint,
   readEnemySquare, placeNewTrap, trapModify, playerTurnAtkBuff, manual */
const CARD_DATA = [
  {name:'一点突破',cat:'駒強化',effect:'駒1体の攻撃力+2(永続)',p1:2,p2:1,
    apply:{kind:'pieceStat',stat:'atk',amount:2}},
  {name:'堅牢の鎧',cat:'駒強化',effect:'駒1体の最大HP+2、現在HPも+2(永続)',p1:1,p2:1,
    apply:{kind:'pieceStat',stat:'maxHp',amount:2,alsoHp:2}},
  {name:'応急修理',cat:'駒強化',effect:'駒1体のHP+2(その場で回復)',p1:1,p2:1,
    apply:{kind:'pieceStat',stat:'hp',amount:2,clampHeal:true}},
  {name:'捨て身',cat:'駒強化',effect:'駒1体の攻撃力+3。次の戦闘終了まで被ダメージ+1',p1:2,p2:0,
    apply:[{kind:'pieceStat',stat:'atk',amount:3},{kind:'pieceExtraDamageTaken',amount:1}]},
  {name:'決戦強化',cat:'駒強化',effect:'大駒の攻撃力+2(永続)',p1:1,p2:0,
    apply:{kind:'pieceStat',stat:'atk',amount:2,filter:'large'}},
  {name:'装甲',cat:'駒強化',effect:'このターン終了まで、対象の駒のHP+3(一時効果)',p1:1,p2:1,
    apply:{kind:'pieceTempHp',amount:3}},
  {name:'フレックス',cat:'駒強化',effect:'次に発生する戦闘で、その駒の攻撃力+2',p1:1,p2:1,
    apply:{kind:'pieceNextCombatAtk',amount:2}},
  {name:'武装解除',cat:'駒強化',effect:'次にその駒が戦闘したとき、相手の攻撃力を1減少させる',p1:0,p2:1,
    apply:{kind:'pieceNextCombatEnemyDebuff',amount:1}},
  {name:'起死回生',cat:'駒強化',effect:'HPが2以下の駒1体を選ぶ。次の戦闘の攻撃力+4。戦闘後、その駒は撃破される',p1:1,p2:1,
    apply:{kind:'pieceDestroyAfterCombat',filter:'hpLE2'}},
  {name:'反撃',cat:'駒強化',effect:'相手の駒からダメージを受けた直後に使用する。その駒に1ダメージを与える(戦闘直後に選択肢が出ます)',p1:0,p2:1,interrupt:true,
    apply:{kind:'manual'}},
  {name:'撤退命令',cat:'特殊',effect:'駒1体を自陣側の最も近い空きマスまで後退させる。そのターンこれ以上行動不可',p1:1,p2:1,
    apply:{kind:'pieceRetreat'}},
  {name:'決死の進軍',cat:'特殊',effect:'駒1体は、このターン中、罠を踏んでも「動けなくなる」を無視する',p1:3,p2:0,
    apply:{kind:'pieceIgnoreImmobilize'}},
  {name:'仕込み毒',cat:'罠強化',effect:'自分のダメージ罠1枚のダメージ+1',p1:1,p2:1,
    apply:{kind:'trapModify',field:'dmgBonus',amount:1,trapFilter:'damage',needUnrevealed:true}},
  {name:'促進剤',cat:'罠強化',effect:'自分のデバフ罠1枚を強化。踏んだ駒は次の戦闘2回分、被ダメージ+1',p1:0,p2:1,
    apply:{kind:'trapModify',field:'debuffDouble',trapFilter:'debuff',needUnrevealed:true}},
  {name:'罠再起動',cat:'罠強化',effect:'発動済み（除去済み）の自分の罠1個を、空いているマスに再設置する',p1:0,p2:2,
    apply:{kind:'reactivateSpentTrap'}},
  {name:'罠改造',cat:'罠強化',effect:'自分の未発動の罠1個を強化する（どの種類でもダメージ+1を付与）',p1:0,p2:1,
    apply:{kind:'trapModify',field:'dmgBonus',amount:1,needUnrevealed:true}},
  {name:'トラバサミ',cat:'罠',effect:'新しく罠を1個設置する。踏んだ駒は共通効果に加え、このターンを含む2ターンが終了するまで動けない',p1:0,p2:1,
    apply:{kind:'placeNewTrap',trapType:'damage',special:'bear-trap'}},
  {name:'囮罠',cat:'罠',effect:'新しく罠を1個設置する。踏んだとき設置者はカードを1枚引く。踏んだ駒の情報は得られない',p1:1,p2:1,
    apply:{kind:'placeNewTrap',trapType:'draw'}},
  {name:'地雷',cat:'罠',effect:'新しく罠を1個設置する。踏んだ駒に1ダメージ。中駒・大駒なら次の戦闘終了まで被ダメージ+1',p1:1,p2:1,
    apply:{kind:'placeNewTrap',trapType:'damage',special:'landmine'}},
  {name:'断片解析',cat:'情報',effect:'相手の伏せ札からランダムに1枚を確認する',p1:1,p2:1,
    apply:{kind:'revealRandomOpponentCard'}},

let state = null;
const app = document.getElementById('app');
function uid(){ return Math.random().toString(36).slice(2,9); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function otherOf(n){ return n===1?2:1; }

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function sanitizeName(s){
  return String(s||'').replace(/[\r\n\t]/g,'').slice(0, MAX_NAME_LEN);

function buildDeck(playerNum){
  const key = playerNum===1 ? 'p1' : 'p2';

  CARD_DATA.forEach(def=>{

      cards.push({ uid:uid(), name:def.name, cat:def.cat, effect:def.effect, interrupt:!!def.interrupt, apply:def.apply });
    }
  });
  return shuffle(cards);
}

/* =========================================================
   ONLINE (PeerJS / ルームコード最小版)
========================================================= */
let netPeer = null;
let netConn = null;
let netSyncing = false; // 受信中の再ブロードキャスト防止
let peerJsLoading = null;

function loadPeerJS(){
  if(typeof Peer !== 'undefined') return Promise.resolve();
  if(peerJsLoading) return peerJsLoading;
  peerJsLoading = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.async = true;
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('PeerJSの読み込みに失敗しました（ネット接続とHTTPSを確認）'));
    document.head.appendChild(s);
  });
  return peerJsLoading;
}

function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function isOnline(){ return state && state.net && state.net.mode==='online'; }
function isHost(){ return isOnline() && state.net.role==='host'; }
function isGuest(){ return isOnline() && state.net.role==='guest'; }
function myPlayer(){ return (state && state.net && state.net.localPlayer) || 1; }
function serializeState(){
  // peer接続オブジェクトは送らない
  const copy = JSON.parse(JSON.stringify(state, (k,v)=>{
    if(k==='net') return { mode:v.mode, role:v.role, localPlayer:v.localPlayer, roomCode:v.roomCode, status:v.status, errorMsg:v.errorMsg||'', joinCode:v.joinCode||'' };
    return v;
  }));
  return copy;
}
function applyRemoteState(remote){
  netSyncing = true;
  const myNet = { ...state.net };
  state = remote;
  // 自分視点の net 情報は上書きしない
  state.net = {
    ...remote.net,
    mode:'online',
    role: myNet.role,
    localPlayer: myNet.localPlayer,
    roomCode: myNet.roomCode || remote.net.roomCode,
    status: 'connected',
    errorMsg: '',
    joinCode: myNet.joinCode||''
  };
  netSyncing = false;
  render();
}
function broadcastState(){
  if(netSyncing || !isHost() || !netConn || netConn.open!==true) return;
  try{
    netConn.send({ type:'state', state: serializeState() });
  }catch(e){ console.warn('broadcast failed', e); }
}
function sendActionToHost(payload){
  if(!isGuest() || !netConn || netConn.open!==true) return;
  try{
    netConn.send({ type:'action', payload });
  }catch(e){ console.warn('send action failed', e); }
}
function destroyNet(){
  try{ if(netConn) netConn.close(); }catch(e){}
  try{ if(netPeer) netPeer.destroy(); }catch(e){}
  netConn = null;
  netPeer = null;
}
function setupHostConnection(conn){
  netConn = conn;
  conn.on('open', ()=>{
    state.net.status = 'connected';
    log('相手が部屋に入室しました');
    toast('相手が入室しました。対局を開始できます');
    render();
    broadcastState();
  });
  conn.on('data', data=>{
    if(!data || typeof data!=='object') return;
    if(data.type==='action' && data.payload){
      handleRemoteAction(data.payload);
    } else if(data.type==='player-name'){
      state.names[2] = sanitizeName(data.name);
      render();
    }
  });
  conn.on('close', ()=>{
    state.net.status = 'error';
    state.net.errorMsg = '相手との接続が切れました';
    toast('相手との接続が切れました');
    render();
  });
  conn.on('error', err=>{
    state.net.status = 'error';
    state.net.errorMsg = String(err && err.message || err);
    render();
  });
}
function createRoom(){
  destroyNet();
  const code = genRoomCode();
  state.net = { mode:'online', role:'host', localPlayer:1, roomCode:code, status:'waiting', errorMsg:'接続準備中…', joinCode:'' };
  state.names[1] = state.names[1] || '';
  render();
  loadPeerJS().then(()=>{
    try{
      netPeer = new Peer(code, { debug:1 });
    }catch(e){
      state.net.status='error'; state.net.errorMsg='PeerJSを初期化できませんでした'; render(); return;
    }
    netPeer.on('open', id=>{
      state.net.roomCode = id;
      state.net.status = 'waiting';
      state.net.errorMsg = '';
      render();
    });
    netPeer.on('connection', conn=>{
      if(netConn && netConn.open){ conn.close(); return; }
      setupHostConnection(conn);
    });
    netPeer.on('error', err=>{
      state.net.status = 'error';
      state.net.errorMsg = (err && err.type==='unavailable-id') ? 'そのルームコードは既に使われています。再作成してください' : String(err && err.message || err);
      render();
    });
  }).catch(err=>{
    state.net.status='error';
    state.net.errorMsg = String(err && err.message || err) + ' ※iPhoneではファイル直接開きではなく、httpsのURLで開いてください';
    render();
  });
}
function joinRoom(code){
  destroyNet();
  code = String(code||'').trim().toUpperCase();
  if(!code || code.length<4){ toast('ルームコードを入力してください'); return; }
  state.net = { mode:'online', role:'guest', localPlayer:2, roomCode:code, status:'connecting', errorMsg:'接続準備中…', joinCode:code };
  render();
  loadPeerJS().then(()=>{
    try{
      netPeer = new Peer({ debug:1 });
    }catch(e){
      state.net.status='error'; state.net.errorMsg='PeerJSを初期化できませんでした'; render(); return;
    }
    netPeer.on('open', ()=>{
      netConn = netPeer.connect(code, { reliable:true });
      netConn.on('open', ()=>{
        state.net.status = 'connected';
        state.net.errorMsg = '';
        netConn.send({ type:'player-name', name: state.names[2] });
        toast('部屋に接続しました');
        render();
      });
      netConn.on('data', data=>{
        if(!data || typeof data!=='object') return;
        if(data.type==='state' && data.state){
          applyRemoteState(data.state);
        }
      });
      netConn.on('close', ()=>{
        state.net.status='error'; state.net.errorMsg='ホストとの接続が切れました'; render();
      });
      netConn.on('error', err=>{
        state.net.status='error'; state.net.errorMsg=String(err&&err.message||err); render();
      });
    });
    netPeer.on('error', err=>{
      state.net.status='error';
      state.net.errorMsg = String(err && err.message || err);
      render();
    });
  }).catch(err=>{
    state.net.status='error';
    state.net.errorMsg = String(err && err.message || err) + ' ※iPhoneではファイル直接開きではなく、httpsのURLで開いてください';
    render();
  });
}
function handleRemoteAction(payload){
  // ゲストからの操作をホストが実行（クリック処理と同じ分岐）
  if(!isHost()) return;
  const action = payload.action;
  const r = payload.r, c = payload.c, id = payload.id, delta = payload.delta;
  const type = payload.type;
  const player = payload.player;
  // 手番チェック（ゲストはプレイヤー2）
  const me = 2;
  if(state.phase==='main' && state.active!==me && !['interrupt-yes','interrupt-no','dismiss-info-reveal','cancel-targeting','dismiss-banner'].includes(action)){
    return;
  }
  switch(action){
    case 'gate-ready': gateReady(); break;
    case 'handoff-ready': handoffReady(); break;
    case 'pick-target': pickTarget(r,c); break;
    case 'set-piece-type': setPendingPieceType(type); break;
    case 'place-piece': placePiece(r,c); break;
    case 'set-trap-type': setPendingTrapType(type); break;
    case 'place-trap': placeTrap(r,c); break;
    case 'select-piece': selectPieceById(id); break;
    case 'move-to': moveSelectedTo(r,c); break;
    case 'deselect': state.selected=null; render(); break;
    case 'use-card': {
      const pl = state.players[state.active];
      const card = pl.hand.find(c=>c.uid===id);
      if(card && card.apply && ['drawCards','conditionalDraw','supplyDraw','reserveExtraPlay'].includes((Array.isArray(card.apply)?card.apply[0]:card.apply).kind)) applyImmediateCardWithDrawFlow(id);
      else useCard(id);
      break;
    }
    case 'resolve-bury': resolveBury(id); break;
    case 'apply-target-piece': resolveApplyPieceTarget(id); break;
    case 'apply-target-enemy-piece': resolveApplyEnemyPieceTarget(id); break;
    case 'apply-target-square': resolveApplySquareTarget(r,c); break;
    case 'apply-target-trap': resolveApplyTrapTarget(id); break;
    case 'cancel-targeting': cancelTargeting(); break;
    case 'interrupt-yes': resolveInterrupt(true); break;
    case 'interrupt-no': resolveInterrupt(false); break;
    case 'dismiss-banner': dismissManualBanner(); break;
    case 'dismiss-info-reveal': state.infoReveal=null; render(); break;
    case 'request-end-turn': requestEndTurn(); break;
    case 'confirm-end-turn': endTurn(); break;
    case 'cancel-end-turn': cancelEndTurn(); break;
    case 'turn-start-ready': turnStartReady(); break;
    case 'toggle-hidden': toggleCardHidden(player, id); break;
    case 'confirm-hand-hide': confirmHandHide(); break;
    case 'coinflip-next': afterCoinflip(); break;
    default: break;
  }
}
function canLocalAct(){
  if(!isOnline()) return true;
  if(state.net.status!=='connected') return false;
  const me = myPlayer();
  // タイトル・結果はホストのみ開始操作など別制御
  if(state.phase==='title' || state.phase==='coinflip-anim' || state.phase==='coinflip-result'){
    return isHost();
  }
  if(state.phase==='main'){
    if(state.confirmEndTurn || state.turnStartGate) return true; // ゲートは両者操作可（確認用）
    if(state.infoReveal) return true;
    if(state.currentInterrupt) return state.currentInterrupt.owner===me;
    return state.active===me;
  }
  if(state.phase==='hand-hide') return state.handHider===me;
  if(state.phase==='target') return state.targetPicker===me && state.gateOpen;
  if(state.phase==='piece-place') return state.piecePlacer===me && state.handoffOpen;
  if(state.phase==='trap-gate') return state.trapPlacer===me && state.gateOpen;
  if(state.phase==='gameover') return true;
  // ゲート待ち画面は該当プレイヤー／相手の準備ボタン
  return true;
}
function log(msg){ state.log.unshift(msg); if(state.log.length>60) state.log.length=60; }
let toastTimer=null;
function toast(msg){ state.toastMsg=msg; render(); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ state.toastMsg=null; render(); },4200); }
function hiddenCount(playerNum){
  // 温存など「伏せ枠にカウントしない」使用済みは除外
  return state.players[playerNum].hand.filter(c=>c.faceDown && !c.noFaceDownSlot).length;
}
function toggleCardHidden(playerNum,cardUid){
  const pl = state.players[playerNum];
  const card = pl.hand.find(c=>c.uid===cardUid);
  if(!card) return;
  // 使用済みカードは次ターン開始まで公開できない
  if(card.usedThisTurn){ toast('使用済みのカードは次の自分のターン開始まで公開できません'); return; }
  if(card.faceDown){ card.faceDown=false; }
  else{ if(hiddenCount(playerNum)>=3){ toast('伏せられるのは同時に3枚までです'); return; } card.faceDown=true; }
  render();
}
/* カード使用: 捨て札にせず手札に伏せて残す。次ターン開始時に捨て札へ移る */
function markCardUsed(playerNum, card, {countTowardLimit=true, skipFaceDownLimit=false}={}){
  if(card.usedThisTurn){
    toast('このカードは既に使用済みです');
    return false;
  }
  // 表のカードを使う場合、伏せ枠が空いている必要がある（温存などは例外）
  if(!skipFaceDownLimit && !card.faceDown && hiddenCount(playerNum)>=3){
    toast('伏せ枠がいっぱいです（最大3枚）。先に伏せカードを使うか、公開して枠を空けてください');
    return false;
  }
  card.faceDown = true;
  card.usedThisTurn = true;
  if(skipFaceDownLimit) card.noFaceDownSlot = true;
  if(countTowardLimit) state.cardsUsedThisTurn++;
  return true;
}
/* ターン終了時: 使用済みカードを手札から捨て札へ移す */
function flushUsedCards(playerNum){
  const pl = state.players[playerNum];
  const kept = [];
  let flushed = 0;
  pl.hand.forEach(c=>{
    if(c.usedThisTurn){
      pl.discard.push({name:c.name, faceDown:false});
      flushed++;
    } else {
      kept.push(c);
    }
  });
  pl.hand = kept;
  return flushed;
}

let audioCtx=null;
function getAudioCtx(){ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) audioCtx=new AC(); } return audioCtx; }
function playTone(freq,duration,type,volume){
  if(state.muted) return;
  try{
    const ctx=getAudioCtx(); if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume();
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type||'sine'; osc.frequency.value=freq;
    gain.gain.setValueAtTime(volume||0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+duration);
  }catch(e){ /* audio unavailable, ignore silently */ }
}

function describeOpsText(ops){
  const parts=[];
  (ops||[]).forEach(op=>{
    if(op.kind==='pieceStat'){
      if(op.amount==='toMax') parts.push('HP全回復');
      else if(op.stat==='hp') parts.push(`${op.clampHeal?'HP回復+':'HP'}${op.amount}`);
      else if(op.stat==='maxHp') parts.push(`最大HP+${op.amount}${op.alsoHp?` HP+${op.alsoHp}`:''}`);
      else if(op.stat==='atk') parts.push(`ATK+${op.amount}`);
    } else if(op.kind==='pieceTempHp') parts.push(`HP+${op.amount}(一時)`);
    else if(op.kind==='pieceExtraDamageTaken') parts.push(`被ダメ+${op.amount}(次戦闘)`);
    else if(op.kind==='pieceNextCombatAtk') parts.push(`次戦闘ATK+${op.amount}`);
    else if(op.kind==='pieceNextCombatEnemyDebuff') parts.push(`相手ATK-${op.amount}(次戦闘)`);
    else if(op.kind==='pieceSaveOnce') parts.push('撃破無効(1回)');
    else if(op.kind==='pieceDestroyAfterCombat') parts.push('次戦闘ATK+4');
    else if(op.kind==='pieceRetreat') parts.push('後退');
    else if(op.kind==='pieceIgnoreImmobilize') parts.push('束縛無効');
    else if(op.kind==='pieceIgnoreDebuffNextCombat') parts.push('デバフ無効(次戦闘)');
  });
  return parts.join(' / ');
}

========================================================= */
function ownRows(p){ return p===1 ? [5,6,7,8] : [0,1,2,3]; }
function targetRow(p){ return p===1 ? 8 : 0; }
function isOwnTerritory(p,r,c){ return ownRows(p).includes(r) && c>=0 && c<5; }
/* 的の列には駒・罠を置けない（配置用） */
function isPlaceableTerritory(p,r,c){ return isOwnTerritory(p,r,c) && r !== targetRow(p); }
function pieceAt(r,c){ for(const pn of [1,2]){ const f=state.players[pn].pieces.find(pc=>pc.r===r&&pc.c===c); if(f) return f; } return null; }
function trapAt(r,c){ for(const pn of [1,2]){ const f=state.players[pn].traps.find(t=>t.r===r&&t.c===c); if(f) return f; } return null; }
function findPiece(id){ for(const pn of [1,2]){ const p=state.players[pn].pieces.find(x=>x.id===id); if(p) return p; } return null; }
function findTrap(id){ for(const pn of [1,2]){ const t=state.players[pn].traps.find(x=>x.id===id); if(t) return t; } return null; }
function removePiece(piece){ const pl=state.players[piece.owner]; pl.pieces=pl.pieces.filter(p=>p.id!==piece.id); }
function removeTrap(trap){ const pl=state.players[trap.owner]; pl.traps=pl.traps.filter(t=>t.id!==trap.id); }
function actedCount(p){ return state.players[p].actionsThisTurn || 0; }
function markPieceActed(piece){
  if(!piece.actedOnceThisTurn){
    piece.actedOnceThisTurn = true;
    state.players[piece.owner].actionsThisTurn = (state.players[piece.owner].actionsThisTurn||0) + 1;
  }
  piece.hasActed = true;
}
function isNearEnemyPiece(r,c,activePlayer){
  const enemy = otherOf(activePlayer);
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0) continue;
    const p = pieceAt(r+dr,c+dc);
    if(p && p.owner===enemy) return true;
  }
  return false;
}
/* 移動範囲: 前後左右 最大2マス + 斜め1マス。障害物で停止 */
function computeReachable(piece){
  const res=[];
  const tryCell = (r,c)=>{
    if(r<0||r>8||c<0||c>4) return false;
    const occ = pieceAt(r,c);
    if(occ){
      if(occ.owner===piece.owner) return false;
      res.push({r,c,kind:'combat'});
      return false;
    }
    const trap = trapAt(r,c);
    if(trap && trap.owner!==piece.owner){
      res.push({r,c,kind:'trap'});
      return false;
    }
    res.push({r,c,kind:'move'});
    return true;
  };
  // 直交: 最大2マス
  const orth=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const [dr,dc] of orth){
    for(let step=1; step<=2; step++){
      const nr = piece.r + dr*step, nc = piece.c + dc*step;
      if(!tryCell(nr,nc)) break;
    }
  }
  // 斜め: 1マス
  const diag=[[-1,-1],[-1,1],[1,-1],[1,1]];
  for(const [dr,dc] of diag){
    tryCell(piece.r+dr, piece.c+dc);
  }
  return res;
}
function retreatPiece(piece){
  const rows = ownRows(piece.owner);
  const cells = [];
  rows.forEach(r=>{ for(let c=0;c<5;c++) cells.push({r,c}); });
  cells.sort((a,b)=>(Math.abs(a.r-piece.r)+Math.abs(a.c-piece.c))-(Math.abs(b.r-piece.r)+Math.abs(b.c-piece.c)));
  const dest = cells.find(cell=>!(cell.r===piece.r&&cell.c===piece.c) && !pieceAt(cell.r,cell.c));
  if(dest){ piece.r=dest.r; piece.c=dest.c; log(`${ownerLabel(piece.owner)}の${PIECE_TYPES[piece.type].label}が後退`); }
  markPieceActed(piece);
}

/* =========================================================
   SETUP FLOW
========================================================= */
function doCoinflip(){
  state.phase='coinflip-anim'; render();
  setTimeout(()=>{ state.first = Math.random()<0.5?1:2; state.active=state.first; state.phase='coinflip-result'; render(); },1300);
}
function afterCoinflip(){
  drawCards(1,6); drawCards(2,6);
  // 手札伏せフェイズは後攻のみ
  const second = otherOf(state.first);
  state.phase='hand-hide'; state.handHider=second; state.gateOpen=false;
  render();
}
function gateReady(){ state.gateOpen=true; render(); }
function handoffReady(){ state.handoffOpen=true; render(); }

function pickTarget(r,c){
  const p = state.targetPicker;
  const backRow = p===1?8:0;
  if(r!==backRow) return;
  state.players[p].target = {r,c};
  if(p===1){ state.targetPicker=2; state.gateOpen=false; }
  else { state.phase='piece-place'; state.piecePlacer=state.first; state.handoffOpen=false; }
  render();
}

function setPendingPieceType(type){ state.pendingPieceType=type; render(); }
function placePiece(r,c){
  const pl = state.players[state.piecePlacer];
  const type = state.pendingPieceType;
  if(!type || pl.piecesRemaining[type]<=0) return;
  // 的の列には駒を置けない
  if(!isPlaceableTerritory(state.piecePlacer,r,c) || pieceAt(r,c)) return;
  const def = PIECE_TYPES[type];
  pl.pieces.push({ id:uid(), owner:state.piecePlacer, type, r, c, hp:def.hp, maxHp:def.hp, atk:def.atk,
    hasActed:false, actedOnceThisTurn:false, frozenTurns:0, typeKnown:false,
    pendingNextCombatAtkBonus:0, pendingEnemyAtkDebuff:0, pendingExtraDamageTaken:0, tempHpThisTurn:0,
    saveOnce:false, destroyAfterNextCombat:false, ignoreImmobilize:false, ignoreDebuffNextCombat:false });
  pl.piecesRemaining[type]--;
  sfxMove();
  if(pl.piecesRemaining[type]<=0) state.pendingPieceType=null;
  const remaining = Object.values(pl.piecesRemaining).reduce((a,b)=>a+b,0);
  if(remaining===0){
    state.pendingPieceType=null;
    if(state.piecePlacer===state.first){ state.piecePlacer=otherOf(state.first); state.handoffOpen=false; }
    else { state.phase='trap-gate'; state.trapPlacer=state.first; state.gateOpen=false; }
  }
  render();
}

function setPendingTrapType(type){ state.pendingTrapType=type; render(); }
function placeTrap(r,c){
  const pl = state.players[state.trapPlacer];
  const type = state.pendingTrapType;
  if(!type) return;
  // 的の列には罠を置けない
  if(!isPlaceableTerritory(state.trapPlacer,r,c) || trapAt(r,c)) return;
  pl.traps.push({ id:uid(), owner:state.trapPlacer, type, r, c, revealed:false, note:state.pendingTrapNote||'', dmgBonus:0, debuffDouble:false, special:null });
  pl.trapsPlaced++;
  state.pendingTrapNote='';
  sfxTrap();
  if(pl.trapsPlaced>=10){
    state.pendingTrapType=null;
    if(state.trapPlacer===state.first){ state.trapPlacer=otherOf(state.first); state.gateOpen=false; }
    else { startMainPhase(); return; }
  }
  render();
}
function startMainPhase(){
  state.phase='main'; state.active=state.first; state.turn=1; state.cardsUsedThisTurn=0;
  state.turnStartGate = isOnline() ? false : true;
  state.confirmEndTurn = false;
  log(`対局開始。先攻: ${ownerLabel(state.first)}`);
  render();
}
function confirmHandHide(){
  // 後攻のみ伏せるので、完了したら的選択へ
  state.phase='target'; state.targetPicker=1; state.gateOpen=false;
  render();
}

/* =========================================================
   MAIN PHASE — movement / combat / traps
========================================================= */
function drawCards(playerNum,n,autoHide){
  const pl=state.players[playerNum];
  for(let i=0;i<n && pl.deck.length>0;i++){
    const c=pl.deck.shift();
    c.faceDown = !!(autoHide && hiddenCount(playerNum)<3);
    pl.hand.push(c);
  }
}

function selectPieceById(id){
  if(state.pendingTargeting || state.currentInterrupt) return;
  const p = findPiece(id);
  if(!p || p.owner!==state.active || p.hasActed || p.frozenTurns>0) return;
  if(!p.actedOnceThisTurn && actedCount(state.active)>=3) { toast('このターンに行動できる駒は最大3体までです'); return; }
  state.selected = (state.selected && state.selected.id===id) ? null : p;
  render();
}

function moveSelectedTo(r,c){
  const piece = state.selected;
  if(!piece) return;
  const reach = computeReachable(piece);
  const match = reach.find(x=>x.r===r&&x.c===c);
  if(!match) return;
  let defender = null;
  if(match.kind==='move'){
    piece.r=r; piece.c=c; markPieceActed(piece);
    log(`${ownerLabel(piece.owner)}の${PIECE_TYPES[piece.type].label}が移動`);
    sfxMove();
  } else if(match.kind==='trap'){
    const trap = trapAt(r,c);
    piece.r=r; piece.c=c;
    // markPieceActed は triggerTrap 内で共通効果として行う
    triggerTrap(trap, piece);
  } else if(match.kind==='combat'){
    defender = pieceAt(r,c);
    resolveCombat(piece, defender, {r,c});
  }
  checkWin(piece);
  state.selected = null;
  render();
}

function triggerTrap(trap, piece){
  trap.revealed = true;
  const def = TRAP_TYPES[trap.type];
  log(`${ownerLabel(piece.owner)}の${PIECE_TYPES[piece.type].label}が${ownerLabel(trap.owner)}の罠(${def.label})を踏んだ`);
  // 共通効果: 踏んだ駒はそのターン動けなくなる
  if(piece.ignoreImmobilize){
    log('→ 決死の進軍により「動けなくなる」効果を無視');
    markPieceActed(piece); // 移動自体は行動としてカウント
  } else {
    markPieceActed(piece);
    if(trap.special==='bear-trap'){
      piece.frozenTurns = 1;
      log('→ トラバサミ効果で追加のターン、動けなくなる');
    }
  }
  const trapR=piece.r, trapC=piece.c;
  if(trap.type==='damage'){
    const dmg = 1 + (trap.dmgBonus||0);
    piece.hp = clamp(piece.hp-dmg,0,piece.maxHp);
    log(`→ ${dmg}ダメージ。残りHP ${piece.hp}`);
    fx(trapR,trapC,`-${dmg}`,'damage'); pulsePiece(piece.id,'damage'); sfxDamage();
    if(trap.special==='landmine' && piece.type!=='small' && piece.hp>0){
      piece.pendingExtraDamageTaken = (piece.pendingExtraDamageTaken||0)+1;
      log('→ 地雷:次の戦闘終了まで被ダメージ+1');
    }
    if(piece.hp<=0){ removePiece(piece); log('→ 駒は撃破された'); sfxDefeat(); }
  } else if(trap.type==='draw'){
    drawCards(trap.owner,1);
    log(`→ 設置者(${ownerLabel(trap.owner)})がカードを1枚引いた`);
    fx(trapR,trapC,'+1枚','info'); sfxDraw();
  } else if(trap.type==='debuff'){
    // デバフ: 次の戦闘で被ダメージ+1（促進剤なら2回分）
    const stacks = trap.debuffDouble ? 2 : 1;
    piece.pendingExtraDamageTaken = (piece.pendingExtraDamageTaken||0) + 1;
    piece.debuffCombatCharges = Math.max(piece.debuffCombatCharges||0, stacks);
    log(`→ デバフ:次の戦闘${stacks}回分、被ダメージ+1`);
    toast(`デバフ罠:被ダメージ+1（戦闘${stacks}回分）`);
    fx(trapR,trapC,'デバフ','trap'); sfxTrap();
  } else if(trap.type==='info'){
    // 情報罠: 踏んだ駒の種類・伏せ札1枚・手札/山札枚数を設置者に公開
    const lines = [];
    if(findPiece(piece.id)){
      piece.typeKnown = true;
      lines.push(`踏んだ駒: ${ownerLabel(piece.owner)}の${PIECE_TYPES[piece.type].label}（HP ${piece.hp}/${piece.maxHp}・ATK ${piece.atk}）`);
      log(`→ 情報:駒の種類は${PIECE_TYPES[piece.type].label}`);
    } else {
      lines.push('踏んだ駒: 罠のダメージ等で撃破済み');
    }
    const victim = state.players[piece.owner];
    const hidden = victim.hand.filter(h=>h.faceDown);
    if(hidden.length>0){
      const revealed = hidden[Math.floor(Math.random()*hidden.length)];
      lines.push(`伏せ札の1枚: 「${revealed.name}」（${revealed.cat}）— ${revealed.effect}`);
      log(`→ 情報:伏せ札「${revealed.name}」を確認`);
    } else {
      lines.push('伏せ札: なし（全て公開中、または手札なし）');
      log('→ 情報:相手に伏せ札なし');
    }
    lines.push(`相手の手札 ${victim.hand.length}枚 / 山札 ${victim.deck.length}枚 / 捨札 ${victim.discard.length}枚`);
    const trapNames = [...new Set(victim.deck.filter(c=>c.cat==='罠').map(c=>c.name))];
    lines.push(trapNames.length
      ? `相手の山札に残る罠カード種: ${trapNames.join('、')}`
      : '相手の山札に罠カードは残っていない');
    if(trap.note) lines.push(`設置メモ: ${trap.note}`);
    state.infoReveal = {
      owner: trap.owner,
      title: `情報罠が発動（${ownerLabel(trap.owner)}が確認）`,
      lines
    };
    fx(trapR,trapC,'情報','trap'); sfxTrap();
  }
  // 罠改造などで付いた追加ダメージ（ダメージ罠以外）
  if(trap.type!=='damage' && (trap.dmgBonus||0)>0 && findPiece(piece.id)){
    const extra = trap.dmgBonus;
    piece.hp = clamp(piece.hp-extra,0,piece.maxHp);
    log(`→ 改造ボーナスで追加${extra}ダメージ。残りHP ${piece.hp}`);
    fx(trapR,trapC,`-${extra}`,'damage'); pulsePiece(piece.id,'damage'); sfxDamage();
    if(piece.hp<=0){ removePiece(piece); log('→ 駒は撃破された'); sfxDefeat(); }
  }
  // 発動した罠は除去し、再起動用に記録
  const ownerPl = state.players[trap.owner];
  ownerPl.spentTraps.push({
    type:trap.type, note:trap.note||'', dmgBonus:trap.dmgBonus||0,
    debuffDouble:!!trap.debuffDouble, special:trap.special||null
  });
  removeTrap(trap);
  log('→ 罠は発動後に除去された（再起動で再利用可）');
}

function resolveCombat(attacker, defender, dest){
  const atkPlayerBonus = state.players[attacker.owner].turnAtkBonus||0;
  let effAtkAttacker = attacker.atk + (attacker.pendingNextCombatAtkBonus||0) + atkPlayerBonus - (defender.pendingEnemyAtkDebuff||0);
  let effAtkDefender = defender.atk + (defender.pendingNextCombatAtkBonus||0) - (attacker.pendingEnemyAtkDebuff||0);
  effAtkAttacker = Math.max(0, effAtkAttacker);
  effAtkDefender = Math.max(0, effAtkDefender);
  // 一点集中: 次戦闘の被ダメージ増加デバフを無視
  const atkExtra = attacker.ignoreDebuffNextCombat ? 0 : (attacker.pendingExtraDamageTaken||0);
  const defExtra = defender.ignoreDebuffNextCombat ? 0 : (defender.pendingExtraDamageTaken||0);
  if(attacker.ignoreDebuffNextCombat && (attacker.pendingExtraDamageTaken||0)>0) log('→ 一点集中:攻撃側がデバフ（被ダメ増）を無視');
  if(defender.ignoreDebuffNextCombat && (defender.pendingExtraDamageTaken||0)>0) log('→ 一点集中:防御側がデバフ（被ダメ増）を無視');
  const dmgToAttacker = effAtkDefender + atkExtra;
  const dmgToDefender = effAtkAttacker + defExtra;

  const atkOrigR=attacker.r, atkOrigC=attacker.c, defOrigR=defender.r, defOrigC=defender.c;
  attacker.hp = clamp(attacker.hp-dmgToAttacker,0,attacker.maxHp);
  defender.hp = clamp(defender.hp-dmgToDefender,0,defender.maxHp);
  log(`戦闘: ${ownerLabel(attacker.owner)}${PIECE_TYPES[attacker.type].label}(ATK${effAtkAttacker}) → ${ownerLabel(defender.owner)}${PIECE_TYPES[defender.type].label}(ATK${effAtkDefender})`);
  log(`→ 攻撃側残HP${attacker.hp} / 防御側残HP${defender.hp}`);
  if(dmgToAttacker>0) fx(atkOrigR,atkOrigC,`-${dmgToAttacker}`,'damage');
  if(dmgToDefender>0) fx(defOrigR,defOrigC,`-${dmgToDefender}`,'damage');
  pulsePiece(attacker.id,'damage'); pulsePiece(defender.id,'damage');
  sfxDamage();

  [attacker,defender].forEach(p=>{
    p.pendingNextCombatAtkBonus=0;
    p.pendingEnemyAtkDebuff=0;
    p.ignoreDebuffNextCombat=false;
    // 促進剤など複数回デバフ
    if((p.debuffCombatCharges||0)>1){
      p.debuffCombatCharges--;
      // pendingExtraDamageTaken は維持
    } else {
      p.pendingExtraDamageTaken=0;
      p.debuffCombatCharges=0;
    }
  });

  let attackerDead = attacker.hp<=0, defenderDead = defender.hp<=0;
  if(attackerDead && attacker.saveOnce){ attacker.hp=1; attackerDead=false; attacker.saveOnce=false; log('→ 防衛線が発動しHP1で生存'); }
  if(defenderDead && defender.saveOnce){ defender.hp=1; defenderDead=false; defender.saveOnce=false; log('→ 防衛線が発動しHP1で生存'); }

  if(defenderDead) removePiece(defender);
  if(attackerDead || defenderDead) sfxDefeat();
  // 撃破されても行動回数は消費する
  markPieceActed(attacker);
  if(attackerDead){
    removePiece(attacker); log('→ 攻撃側の駒は撃破された'); toast('戦闘結果:攻撃側が撃破された');
  } else if(defenderDead){
    attacker.r=dest.r; attacker.c=dest.c;
    log('→ 防御側を撃破し、マスを制圧'); toast('戦闘結果:防御側を撃破してマスを制圧');
  } else {
    log('→ 双方生存。攻撃側はその場に留まる'); toast('戦闘結果:双方生存、攻撃側は元の位置のまま');
  }
  if(!attackerDead && attacker.destroyAfterNextCombat){ removePiece(attacker); attackerDead=true; log('→ 起死回生の代償で攻撃側は戦闘後に撃破'); }
  if(!defenderDead && defender.destroyAfterNextCombat){ removePiece(defender); defenderDead=true; log('→ 起死回生の代償で防御側は戦闘後に撃破'); }

  maybeOfferInterrupt(attackerDead?null:attacker, defenderDead?null:defender);
}

function maybeOfferInterrupt(attacker, defender){
  state.currentInterrupt = null;
  if(attacker && !defender){
    const c = state.players[attacker.owner].hand.find(c=>c.name==='戦闘継続');
    if(c){ state.currentInterrupt={type:'chain',cardUid:c.uid,pieceId:attacker.id,owner:attacker.owner}; return; }
  }
  if(attacker && defender){
    const c1 = state.players[attacker.owner].hand.find(c=>c.name==='反撃');
    if(c1){ state.currentInterrupt={type:'counter',cardUid:c1.uid,targetPieceId:defender.id,owner:attacker.owner}; return; }
    const c2 = state.players[defender.owner].hand.find(c=>c.name==='反撃');
    if(c2){ state.currentInterrupt={type:'counter',cardUid:c2.uid,targetPieceId:attacker.id,owner:defender.owner}; return; }
  }
}
function resolveInterrupt(useIt){
  const iv = state.currentInterrupt;
  if(!iv) return;
  const pl = state.players[iv.owner];
  if(useIt){
    const card = pl.hand.find(c=>c.uid===iv.cardUid);
    if(card && !card.usedThisTurn){
      // 割り込みカードも伏せて手札に残す。次の自分ターン開始時に捨て札＆1枚補充
      card.faceDown = true;
      card.usedThisTurn = true;
      pl.cardsUsedLastOwnTurn = (pl.cardsUsedLastOwnTurn||0) + 1;
    }
    if(iv.type==='chain'){
      const p=findPiece(iv.pieceId);
      if(p){
        p.hasActed=false;
        log(`${ownerLabel(iv.owner)}が「戦闘継続」でもう一度行動可能に`);
        toast('戦闘継続:同じ駒でもう一度行動できます');
        fx(p.r,p.c,'連撃!','buff'); pulsePiece(p.id,'buff'); sfxBuff();
      }
    } else if(iv.type==='counter'){
      const t=findPiece(iv.targetPieceId);
      if(t){ t.hp=clamp(t.hp-1,0,t.maxHp); log(`${ownerLabel(iv.owner)}が「反撃」で相手に1ダメージ`); fx(t.r,t.c,'-1','damage'); pulsePiece(t.id,'damage'); sfxDamage(); if(t.hp<=0){ removePiece(t); log('→ 反撃で撃破'); sfxDefeat(); } }
    }
  }
  state.currentInterrupt=null; render();
}

function checkWin(piece){
  if(!findPiece(piece.id)) return;
  const tgt = state.players[otherOf(piece.owner)].target;
  if(tgt && piece.r===tgt.r && piece.c===tgt.c){ state.winner=piece.owner; state.winReason='的への到達'; state.phase='gameover'; sfxWin(); }
}

/* ---- card use / targeting ---- */
function useCard(cardUid){
  if(state.pendingTargeting || state.currentInterrupt) return;
  const pl = state.players[state.active];
  const cardLimit = 3 + (pl.bonusCardsThisTurn||0);
  if(state.cardsUsedThisTurn >= cardLimit){ toast(`このターンに使えるカードは${cardLimit}枚までです`); return; }
  const idx = pl.hand.findIndex(c=>c.uid===cardUid);
  if(idx<0) return;
  const card = pl.hand[idx];
  if(card.usedThisTurn){ toast('このカードは既に使用済みです（次の自分のターン開始まで手札に伏せて残ります）'); return; }
  if(pl.failedThisTurn && pl.failedThisTurn.includes(card.uid)){ toast('このカードは今ターン再使用できません'); return; }
  sfxUse();
  const apply = card.apply;
  const ops = Array.isArray(apply) ? apply : (apply?[apply]:[]);
  const first = ops[0];

  const immediateKinds = ['drawCards','conditionalDraw','supplyDraw','reserveExtraPlay','revealRandomOpponentCard','revealDeckTrapTypes','revealTargetHint','playerTurnAtkBuff'];
  const needsPieceTargetKinds = ['pieceStat','pieceTempHp','pieceNextCombatAtk','pieceNextCombatEnemyDebuff','pieceSaveOnce','pieceDestroyAfterCombat','pieceRetreat','pieceIgnoreImmobilize','pieceIgnoreDebuffNextCombat'];
  if(!first || first.kind==='manual'){
    if(!markCardUsed(state.active, card, {countTowardLimit:!card.interrupt})) return;
    log(`${ownerLabel(state.active)}が「${card.name}」を使用: ${card.effect}`);
    state.manualBanner = { name:card.name, effect:card.effect };
    render(); return;
  }

  if(first.kind==='pieceStat' && first.autoTargetOwnLarge){
    const mine = pl.pieces.find(p=>p.type==='large');
    if(!mine){ toast('大駒が盤上にいません'); return; }
    if(!markCardUsed(state.active, card)) return;
    applyTargetedOps(mine, ops);
    log(`${ownerLabel(state.active)}が「${card.name}」を使用:${card.effect}`);
    toast(`「${card.name}」を大駒に適用`);
    fx(mine.r, mine.c, describeOpsText(ops), 'buff');
    pulsePiece(mine.id, 'buff');
    sfxHeal();
    render(); return;
  }

  if(needsPieceTargetKinds.includes(first.kind)){
    state.pendingTargeting = { cardUid, cardName:card.name, cardEffect:card.effect, kind:first.kind, filter:first.filter||null, ops };
    render(); return;
  }
  if(first.kind==='readEnemySquare' || first.kind==='placeNewTrap' || first.kind==='trapModify' || first.kind==='revealEnemyPieceType'){
    state.pendingTargeting = { cardUid, cardName:card.name, cardEffect:card.effect, kind:first.kind, ops:first };
    render(); return;
  }
  if(first.kind==='reactivateSpentTrap'){
    if(!pl.spentTraps.length){ toast('再設置できる発動済み罠がありません'); return; }
    state.pendingTargeting = { cardUid, cardName:card.name, cardEffect:card.effect, kind:'reactivateSpentTrap', spentIndex: pl.spentTraps.length-1 };
    // 直近の発動済み罠を選んだ状態でマス指定へ
    render(); return;
  }
  if(immediateKinds.includes(first.kind)){
    if(!markCardUsed(state.active, card, {countTowardLimit:!card.interrupt})) return;
    log(`${ownerLabel(state.active)}が「${card.name}」を使用:${card.effect}`);
    applyImmediate(card, first);
    render(); return;
  }
}

function cancelTargeting(){ state.pendingTargeting=null; render(); }

function resolveApplyEnemyPieceTarget(id){
  const pt = state.pendingTargeting;
  if(!pt) return;
  const piece = findPiece(id);
  if(!piece || piece.owner===state.active) return;
  const pl = state.players[state.active];
  const card = pl.hand.find(c=>c.uid===pt.cardUid);
  if(!card){ state.pendingTargeting=null; render(); return; }
  if(!markCardUsed(state.active, card)) return;
  piece.typeKnown = true;
  log(`${ownerLabel(state.active)}が「索敵」で(${piece.r+1},${piece.c+1})の駒を確認:${PIECE_TYPES[piece.type].label}`);
  toast(`索敵の結果:${PIECE_TYPES[piece.type].label}でした`);
  fx(piece.r,piece.c,PIECE_TYPES[piece.type].label,'info'); sfxDraw();
  state.pendingTargeting=null;
  render();
}

function applyTargetedOps(piece, ops){
  ops.forEach(op=>{
    if(op.kind==='pieceStat'){
      if(op.amount==='toMax'){ piece.hp=piece.maxHp; }
      else if(op.stat==='hp'){ piece.hp=clamp(piece.hp+op.amount,0,piece.maxHp); }
      else if(op.stat==='maxHp'){ piece.maxHp+=op.amount; if(op.alsoHp) piece.hp=clamp(piece.hp+op.alsoHp,0,piece.maxHp); }
      else if(op.stat==='atk'){ piece.atk=Math.max(0,piece.atk+op.amount); }
    } else if(op.kind==='pieceTempHp'){ piece.maxHp+=op.amount; piece.hp+=op.amount; piece.tempHpThisTurn=(piece.tempHpThisTurn||0)+op.amount; }
    else if(op.kind==='pieceExtraDamageTaken'){ piece.pendingExtraDamageTaken=(piece.pendingExtraDamageTaken||0)+op.amount; }
    else if(op.kind==='pieceNextCombatAtk'){ piece.pendingNextCombatAtkBonus=(piece.pendingNextCombatAtkBonus||0)+op.amount; }
    else if(op.kind==='pieceNextCombatEnemyDebuff'){ piece.pendingEnemyAtkDebuff=(piece.pendingEnemyAtkDebuff||0)+op.amount; }
    else if(op.kind==='pieceSaveOnce'){ piece.saveOnce=true; }
    else if(op.kind==='pieceDestroyAfterCombat'){ piece.destroyAfterNextCombat=true; piece.pendingNextCombatAtkBonus=(piece.pendingNextCombatAtkBonus||0)+4; }
    else if(op.kind==='pieceRetreat'){ retreatPiece(piece); }
    else if(op.kind==='pieceIgnoreImmobilize'){ piece.ignoreImmobilize=true; }
    else if(op.kind==='pieceIgnoreDebuffNextCombat'){ piece.ignoreDebuffNextCombat=true; }
  });
}

function applyImmediate(card, op){
  const pl = state.players[state.active];
  const opp = state.players[otherOf(state.active)];
  if(op.kind==='playerTurnAtkBuff'){ pl.turnAtkBonus += op.amount; toast(`「${card.name}」:このターンの与ダメージ+${op.amount}`); sfxBuff(); }
  else if(op.kind==='revealRandomOpponentCard'){
    const hidden = opp.hand.filter(h=>h.faceDown);
    if(hidden.length===0){ toast('相手に伏せカードはありません(今は全て公開中)'); sfxWhiff(); }
    else{ const c = hidden[Math.floor(Math.random()*hidden.length)]; toast(`断片解析の結果:「${c.name}」(${c.effect})`); sfxDraw(); }
  } else if(op.kind==='revealDeckTrapTypes'){
    const names = [...new Set(opp.deck.filter(c=>c.cat==='罠').map(c=>c.name))];
    toast(names.length ? `相手の山札に残る罠カード:${names.join('、')}` : '相手の山札に罠カードは残っていません');
    sfxDraw();
  } else if(op.kind==='revealTargetHint'){
    const t = opp.target;
    let hint = '不明(的が未設定)';
    if(t){
      if(t.c < 2) hint = '左寄り';
      else if(t.c > 2) hint = '右寄り';
      else hint = Math.random() < 0.5 ? '左寄り' : '右寄り'; // 中央はランダム
    }
    toast(`的の手掛かり:相手の的は${hint}です`);
    sfxDraw();
  }
}

function resolveApplyPieceTarget(id){
  const pt = state.pendingTargeting;
  if(!pt) return;
  const piece = findPiece(id);
  if(!piece || piece.owner!==state.active) return;
  if(pt.filter==='large' && piece.type!=='large'){ toast('大駒のみ選択できます'); return; }
  if(pt.filter==='hpLE2' && piece.hp>2){ toast('HPが2以下の駒のみ選択できます'); return; }
  const pl = state.players[state.active];
  const card = pl.hand.find(c=>c.uid===pt.cardUid);
  if(!card){ state.pendingTargeting=null; render(); return; }
  if(!markCardUsed(state.active, card)) return;
  applyTargetedOps(piece, pt.ops);
  log(`${ownerLabel(state.active)}が「${card.name}」を使用:${card.effect}`);
  toast(`「${card.name}」を適用`);
  const isHeal = pt.ops.some(o=>o.kind==='pieceStat' && o.stat==='hp' && (o.clampHeal || o.amount==='toMax'));
  fx(piece.r, piece.c, describeOpsText(pt.ops), 'buff');
  pulsePiece(piece.id, 'buff');
  isHeal ? sfxHeal() : sfxBuff();
  state.pendingTargeting=null;
  render();
}

function resolveApplySquareTarget(r,c){
  const pt = state.pendingTargeting;
  if(!pt) return;
  const pl = state.players[state.active];
  const card = pl.hand.find(c2=>c2.uid===pt.cardUid);
  if(!card){ state.pendingTargeting=null; render(); return; }
  const op = pt.ops;
  if(pt.kind==='readEnemySquare'){
    if(!isOwnTerritory(otherOf(state.active),r,c)) return;
    const trap = trapAt(r,c);
    if(trap){
      if(!markCardUsed(state.active, card)) return;
      toast(`罠読みの結果:(${r+1},${c+1})に「${TRAP_TYPES[trap.type].label}」の罠があります`);
      log(`${ownerLabel(state.active)}が「罠読み」で(${r+1},${c+1})を確認:${TRAP_TYPES[trap.type].label}`);
      fx(r,c,TRAP_TYPES[trap.type].label,'info'); sfxDraw();
    } else {
      // 空振り: カードは手札に残り、今ターン再使用不可
      pl.failedThisTurn.push(card.uid);
      toast('罠読みの結果:そのマスに罠はありませんでした(今ターンは再使用不可)');
      log(`${ownerLabel(state.active)}が「罠読み」を使用したが空振り`);
      fx(r,c,'空振り','info'); sfxWhiff();
    }
  } else if(pt.kind==='placeNewTrap'){
    if(r===4 || r===0 || r===8 || trapAt(r,c) || isNearEnemyPiece(r,c,state.active)) {
      toast('そのマスには設置できません(緩衝地帯・的の列・敵駒の周囲8マス・既存罠と重複)'); sfxWhiff(); return;
    }
    if(!markCardUsed(state.active, card)) return;
    pl.traps.push({ id:uid(), owner:state.active, type:op.trapType, r, c, revealed:false, note:'', dmgBonus:0, debuffDouble:false, special:op.special||null });
    log(`${ownerLabel(state.active)}が「${card.name}」で罠を設置`);
    toast(`「${card.name}」の罠を設置しました`);
    fx(r,c,'設置完了','trap'); sfxTrap();
  } else if(pt.kind==='reactivateSpentTrap'){
    if(r===4 || r===0 || r===8 || trapAt(r,c) || isNearEnemyPiece(r,c,state.active)) {
      toast('そのマスには設置できません(緩衝地帯・的の列・敵駒の周囲8マス・既存罠と重複)'); sfxWhiff(); return;
    }
    const spent = pl.spentTraps[pt.spentIndex];
    if(!spent){ toast('再設置する罠が見つかりません'); state.pendingTargeting=null; render(); return; }
    if(!markCardUsed(state.active, card)) return;
    pl.spentTraps.splice(pt.spentIndex,1);
    pl.traps.push({
      id:uid(), owner:state.active, type:spent.type, r, c, revealed:false,
      note:spent.note||'', dmgBonus:spent.dmgBonus||0, debuffDouble:!!spent.debuffDouble, special:spent.special||null
    });
    log(`${ownerLabel(state.active)}が「罠再起動」で${TRAP_TYPES[spent.type].label}罠を再設置`);
    toast(`「${TRAP_TYPES[spent.type].label}」罠を再設置しました`);
    fx(r,c,'再起動','trap'); sfxTrap();
  }
  state.pendingTargeting=null;
  render();
}

function resolveApplyTrapTarget(id){
  const pt = state.pendingTargeting;
  if(!pt) return;
  const trap = findTrap(id);
  if(!trap || trap.owner!==state.active) return;
  const op = pt.ops;
  if(op.needUnrevealed && trap.revealed) return;
  if(op.needRevealed && !trap.revealed) return;
  if(op.trapFilter && trap.type!==op.trapFilter) return;
  const pl = state.players[state.active];
  const card = pl.hand.find(c=>c.uid===pt.cardUid);
  if(!card){ state.pendingTargeting=null; render(); return; }
  if(!markCardUsed(state.active, card)) return;
  if(op.field==='dmgBonus'){
    trap.dmgBonus=(trap.dmgBonus||0)+op.amount;
    toast(op.trapFilter==='damage' ? '仕込み毒:ダメージ+1' : `罠改造:「${TRAP_TYPES[trap.type].label}」にダメージ+${op.amount}`);
  }
  else if(op.field==='debuffDouble'){ trap.debuffDouble=true; toast('促進剤:デバフが戦闘2回分に強化'); }
  else if(op.field==='reactivate'){ trap.revealed=false; toast('罠再起動:対象の罠を再利用可能にしました'); }
  log(`${ownerLabel(state.active)}が「${card.name}」を使用:${card.effect}`);
  fx(trap.r,trap.c,'強化','buff'); sfxBuff();
  state.pendingTargeting=null;
  render();
}

/* supplyDraw (補給) two-step, and immediate-draw kinds handled here since they need custom flow */
function applyImmediateCardWithDrawFlow(cardUid){
  const pl = state.players[state.active];
  const cardLimit = 3 + (pl.bonusCardsThisTurn||0);
  if(state.cardsUsedThisTurn >= cardLimit){ toast(`このターンに使えるカードは${cardLimit}枚までです`); return; }
  const card = pl.hand.find(c=>c.uid===cardUid);
  if(!card) return;
  if(card.usedThisTurn){ toast('このカードは既に使用済みです'); return; }
  sfxUse();
  const op = card.apply;
  // 使用済みを除いた手札枚数で条件判定（このカード自身はまだ未使用として数える）
  const usableHand = pl.hand.filter(c=>!c.usedThisTurn).length;
  if(op.kind==='drawCards'){
    if(!markCardUsed(state.active, card)) return;
    drawCards(state.active, op.amount); toast(`「${card.name}」でカードを${op.amount}枚引きました`); sfxDraw();
  } else if(op.kind==='conditionalDraw'){
    if(!markCardUsed(state.active, card)) return;
    // 使用後はusableが1減るので、使用前のusableHandで判定
    if(usableHand<=2){ drawCards(state.active, op.amount); toast(`「${card.name}」条件達成:${op.amount}枚ドロー`); sfxDraw(); }
    else { toast(`「${card.name}」:使用可能手札が${usableHand}枚のため条件未達（2枚以下で発動）`); sfxWhiff(); }
  } else if(op.kind==='supplyDraw'){
    if(!markCardUsed(state.active, card)) return;
    drawCards(state.active,2); sfxDraw();
    state.pendingTargeting = { kind:'supplyBury', cardName:card.name };
    toast('補給:2枚引きました。山札の一番下に戻す1枚を手札から選んでください（使用済み以外）');
  } else if(op.kind==='reserveExtraPlay'){
    // 使用枚数・伏せ枠にカウントしない。追加で2枚使える（その2枚分は補充されない）
    if(!markCardUsed(state.active, card, {countTowardLimit:false, skipFaceDownLimit:true})) return;
    pl.bonusCardsThisTurn = (pl.bonusCardsThisTurn||0)+2;
    toast(`「${card.name}」:このターン追加で2枚使えます（使用・伏せ枠にはカウントしません）`); sfxBuff();
  }
  log(`${ownerLabel(state.active)}が「${card.name}」を使用:${card.effect}`);
  render();
}
function resolveBury(cardUid){
  const pl = state.players[state.active];
  const idx = pl.hand.findIndex(c=>c.uid===cardUid);
  if(idx<0) return;
  const card = pl.hand[idx];
  if(card.usedThisTurn){ toast('使用済みカードは山札に戻せません'); return; }
  pl.hand.splice(idx,1);
  // 伏せ状態を解除して山札の下へ
  card.faceDown = false;
  card.usedThisTurn = false;
  pl.deck.push(card);
  state.pendingTargeting=null;
  toast(`「${card.name}」を山札の一番下に戻しました`);
  render();
}

function dismissManualBanner(){ state.manualBanner=null; render(); }

/* =========================================================
   PIECE PANEL MANUAL OVERRIDES
========================================================= */
function adjustPieceStat(id,stat,delta){
  const p = findPiece(id); if(!p) return;
  if(stat==='hp'){ p.hp=clamp(p.hp+delta,0,p.maxHp); if(p.hp<=0){ const lbl=`${ownerLabel(p.owner)}の${PIECE_TYPES[p.type].label}`; removePiece(p); if(state.selected&&state.selected.id===id) state.selected=null; log(`${lbl}のHPが0になり撃破された`); } }
  else if(stat==='maxHp'){ p.maxHp=Math.max(1,p.maxHp+delta); p.hp=Math.min(p.hp,p.maxHp); }
  else if(stat==='atk'){ p.atk=Math.max(0,p.atk+delta); }
  render();
}
function destroyPieceById(id){ const p=findPiece(id); if(!p) return; removePiece(p); if(state.selected&&state.selected.id===id) state.selected=null; log(`${ownerLabel(p.owner)}の${PIECE_TYPES[p.type].label}を手動で撃破`); render(); }
function toggleActed(id){ const p=findPiece(id); if(!p) return; p.hasActed=!p.hasActed; render(); }
function toggleTrapRevealed(id){ const t=findTrap(id); if(t){ t.revealed=!t.revealed; render(); } }

/* =========================================================
   TURN CYCLE
========================================================= */
function requestEndTurn(){
  if(state.pendingTargeting || state.currentInterrupt) return;
  if(isOnline()){ endTurn(); return; } // オンラインは受け渡し確認不要
  if(state.confirmEndTurn) return;
  state.confirmEndTurn = true;
  render();
}
function cancelEndTurn(){
  state.confirmEndTurn = false;
  render();
}
function endTurn(){
  if(state.pendingTargeting || state.currentInterrupt) return;
  state.confirmEndTurn = false;
  sfxTurnEnd();
  const pl = state.players[state.active];
  pl.pieces.forEach(p=>{
    if(p.tempHpThisTurn){ p.maxHp-=p.tempHpThisTurn; p.hp=clamp(p.hp-p.tempHpThisTurn,0,p.maxHp); p.tempHpThisTurn=0; if(!findPiece(p.id)){} }
    p.ignoreImmobilize=false;
  });
  pl.pieces = pl.pieces.filter(p=>p.hp>0);

  // 使用済みカードは手札に伏せたまま残す（自分の次ターン開始時まで）
  if(state.cardsUsedThisTurn===0 && pl.deck.length>0){
    const top = pl.deck.shift(); pl.discard.push({name:top.name,faceDown:true});
    log(`${ownerLabel(state.active)}はカード未使用のため山札の一番上を伏せて捨て札に`);
  }
  // 補充枚数 = 通常使用（温存ボーナス除く） + 今ターンの割り込み使用
  const effectiveUsed = Math.max(0, state.cardsUsedThisTurn - (pl.bonusCardsThisTurn||0));
  const interruptUsed = pl.hand.filter(c=>c.usedThisTurn && c.interrupt).length;
  pl.cardsUsedLastOwnTurn = effectiveUsed + interruptUsed;
  pl.turnAtkBonus = 0; pl.bonusCardsThisTurn = 0; pl.failedThisTurn = [];
  pl.actionsThisTurn = 0;

  const nextActive = otherOf(state.active);
  state.active = nextActive;
  state.cardsUsedThisTurn = 0; state.selected = null;
  state.showOwnTraps = false; state.showOwnTarget = false;
  if(nextActive===state.first) state.turn++;
  const npl = state.players[nextActive];
  npl.actionsThisTurn = 0;
  npl.pieces.forEach(p=>{
    p.actedOnceThisTurn = false;
    if(p.frozenTurns>0){ p.frozenTurns--; p.hasActed=true; } else { p.hasActed=false; }
  });

  // ★ 次プレイヤーのターン開始処理:
  // 前回使用して伏せのまま残っていたカードを捨て札へ移し、記録した枚数分を補充
  const flushed = flushUsedCards(nextActive);
  if(flushed>0) log(`${ownerLabel(nextActive)}の前回使用カード${flushed}枚を捨て札へ`);
  drawCards(nextActive, npl.cardsUsedLastOwnTurn||0, true);

  log(`--- ${ownerLabel(nextActive)}のターン(第${state.turn}ターン) ---`);
  // オンラインは各自画面なので受け渡しゲート不要
  state.turnStartGate = isOnline() ? false : true;
  if(state.players[1].deck.length===0 && state.players[2].deck.length===0){ endGameByDeckOut(); }
  else render();
}
function turnStartReady(){
  state.turnStartGate = false;
  render();
}
function endGameByDeckOut(){
  const dist = p=>{ const pl=state.players[p]; if(pl.pieces.length===0) return Infinity; const enemyBack=p===1?0:8; return Math.min(...pl.pieces.map(pc=>Math.abs(pc.r-enemyBack))); };
  const d1=dist(1), d2=dist(2);
  if(d1<d2){ state.winner=1; state.winReason='的への接近度'; }
  else if(d2<d1){ state.winner=2; state.winReason='的への接近度'; }
  else { const hp=p=>state.players[p].pieces.reduce((s,pc)=>s+pc.hp,0); const h1=hp(1),h2=hp(2);
    if(h1>h2){ state.winner=1; state.winReason='合計HP'; } else if(h2>h1){ state.winner=2; state.winReason='合計HP'; } else { state.winner=0; state.winReason='引き分け'; } }
  state.phase='gameover'; sfxWin(); render();
}

/* =========================================================
   RENDER
========================================================= */
function onlineWaitInfo(){
  // オンライン時、自分の操作番でなければ盤面を隠す
  if(!isOnline() || state.net.status!=='connected') return null;
  const me = myPlayer();
  if(state.phase==='title' || state.phase==='gameover') return null;
  if(state.phase==='coinflip-anim'){
    return { title:'先攻・後攻を決定中', body:'少々お待ちください…' };
  }
  if(state.phase==='coinflip-result'){
    if(isHost()) return null;
    return { title:'先攻が決まりました', body:`先攻は ${ownerLabel(state.first)} です。ホストの進行をお待ちください。` };
  }
  if(state.phase==='hand-hide'){
    if(state.handHider===me) return null;
    return { title:'相手が手札を伏せています', body:`${ownerLabel(state.handHider)}が伏せ札を選んでいます。画面は隠しています。` };
  }
  if(state.phase==='target'){
    if(state.targetPicker===me) return null;
    return { title:'相手が的を選択中', body:`${ownerLabel(state.targetPicker)}が的のマスを選んでいます。画面は隠しています。` };
  }
  if(state.phase==='piece-place'){
    if(state.piecePlacer===me) return null;
    return { title:'相手が駒を配置中', body:`${ownerLabel(state.piecePlacer)}が駒を配置しています。画面は隠しています。` };
  }
  if(state.phase==='trap-gate'){
    if(state.trapPlacer===me) return null;
    return { title:'相手が罠を配置中', body:`${ownerLabel(state.trapPlacer)}が罠を配置しています。画面は隠しています。` };
  }
  if(state.phase==='main'){
    // 自分宛の割り込み・情報公開は表示
    if(state.infoReveal && state.infoReveal.owner===me) return null;
    if(state.currentInterrupt && state.currentInterrupt.owner===me) return null;
    if(state.active===me) return null;
    return { title:`${ownerLabel(state.active)}のターンです`, body:'相手の操作が終わるまで画面を隠しています。しばらくお待ちください。' };
  }
  return null;
}
function renderOnlineWait(info){
  return `<div class="gate">
    <div class="gate-icon">🙈</div>
    <p class="gate-msg">
      <b class="${myPlayer()===1?'pill p1':'pill p2'}">${escapeHtml(ownerLabel(myPlayer()))}</b><br>
      <b>${escapeHtml(info.title)}</b><br>
      ${escapeHtml(info.body)}
    </p>
    <p class="muted tiny">相手の操作が終わると自動で切り替わります</p>
  </div>`;
}
function render(){
  // オンライン時は画面隠しゲートを自動スキップ（自分の操作画面を直接表示）
  if(isOnline()){
    if(state.phase==='target' || state.phase==='trap-gate' || state.phase==='hand-hide') state.gateOpen = true;
    if(state.phase==='piece-place') state.handoffOpen = true;
    state.turnStartGate = false;
  }
  let html='';
  const wait = onlineWaitInfo();
  if(wait){
    html = renderOnlineWait(wait);
  } else switch(state.phase){
    case 'title': html=renderTitle(); break;
    case 'coinflip-anim': html=renderCoinflipAnim(); break;
    case 'coinflip-result': html=renderCoinflipResult(); break;
    case 'target':
      html = state.gateOpen ? renderTargetPick() : renderGate(`${ownerLabel(otherOf(state.targetPicker))}は画面を見ないでください。`,`${ownerLabel(state.targetPicker)}が的(自陣奥列の1マス)を選びます。`);
      break;
    case 'piece-place':
      html = state.handoffOpen ? renderPlacePiece() : renderHandoff(state.piecePlacer, '駒を6個配置します(全部置き終えたら相手の番になります)。');
      break;
    case 'trap-gate':
      html = state.gateOpen ? renderPlaceTrap() : renderGate(`${ownerLabel(otherOf(state.trapPlacer))}は画面を見ないでください。`,`${ownerLabel(state.trapPlacer)}が罠10個を配置します。`);
      break;
    case 'hand-hide':
      html = state.gateOpen ? renderHandHide() : renderGate(`${ownerLabel(otherOf(state.handHider))}（先攻）は画面を見ないでください。`,`後攻の${ownerLabel(state.handHider)}が手札を伏せます（先攻は伏せフェイズなし）。`);
      break;
    case 'main':
      if(state.confirmEndTurn) html = renderTurnHandoff();
      else if(state.turnStartGate) html = renderTurnStartGate();
      else html = renderMain();
      break;
    case 'gameover': html=renderGameOver(); break;
    default: html=renderTitle();
  }
  if(state.toastMsg) html += `<div class="toast">${escapeHtml(state.toastMsg)}</div>`;
  html += `<button class="mute-toggle" data-action="toggle-mute" title="${state.muted?'音を有効にする':'音を消す'}">${state.muted?'🔇':'🔊'}</button>`;
  html += `<button class="ref-toggle" data-action="open-reference">カード・罠一覧</button>`;
  if(state.showReference) html += renderReferenceOverlay();
  if(state.cellInfo) html += renderCellInfoOverlay();
  // オンライン接続状態バー
  if(isOnline()){
    const st = state.net.status;
    const stLabel = st==='waiting'?'相手の入室待ち':st==='connecting'?'接続中…':st==='connected'?'オンライン接続中':st==='error'?'接続エラー':st;
    html = `<div class="status-bar" style="margin-bottom:8px;"><span class="pill ${myPlayer()===1?'p1':'p2'}">${escapeHtml(ownerLabel(myPlayer()))}</span>
      ルーム <b style="font-family:var(--font-mono)">${escapeHtml(state.net.roomCode||'-')}</b> ・ ${escapeHtml(stLabel)}
      ${state.net.errorMsg?` ・ <span style="color:var(--danger)">${escapeHtml(state.net.errorMsg)}</span>`:''}
      ${isHost()&&st==='waiting'?' ・ コードを相手に共有してください':''}
    </div>` + html;
  }
  app.innerHTML = html;
  broadcastState();
}

function renderCellInfoOverlay(){
  const info = state.cellInfo;
  if(!info) return '';
  return `<div class="cell-info-overlay" data-action="close-cell-info">
    <div class="cell-info-panel" data-action="cell-info-keep">
      <div class="spread"><h3>マス情報 (${info.r+1}, ${info.c+1})</h3>
      <button type="button" class="btn small ghost" data-action="close-cell-info">閉じる</button></div>
      ${info.lines.map(l=>`<div class="info-row">${l}</div>`).join('')}
    </div>
  </div>`;
}

function showCellInfo(r,c){
  const lines = [];
  const isBuffer = r===4;
  lines.push(`<b>位置:</b> ${isBuffer?'緩衝地帯':(r<4?'P2陣地':'P1陣地')} 行${r+1} 列${c+1}`);
  if(r===0 || r===8) lines.push(`<b>的の列:</b> この列には駒・罠を配置できません`);
  const piece = pieceAt(r,c);
  if(piece){
    const known = piece.owner===state.active || piece.typeKnown || state.phase!=='main';
    if(known){
      lines.push(`<b>駒:</b> ${ownerLabel(piece.owner)} ${PIECE_TYPES[piece.type].label} (HP ${piece.hp}/${piece.maxHp}, ATK ${piece.atk})`);
      if(piece.hasActed) lines.push('状態: 行動済み');
      if(piece.frozenTurns>0) lines.push('状態: 凍結中');
    } else {
      lines.push(`<b>駒:</b> ${ownerLabel(piece.owner)} の駒 (種類・HP不明)`);
    }
  } else {
    lines.push('<b>駒:</b> なし');
  }
  const trap = trapAt(r,c);
  if(trap){
    const show = trap.revealed || (trap.owner===state.active && (state.showOwnTraps || state.phase!=='main'));
    if(show){
      lines.push(`<b>罠:</b> ${ownerLabel(trap.owner)} の「${TRAP_TYPES[trap.type].label}」${trap.revealed?'(発動済み)':'(未発動)'}`);
    } else if(trap.owner===state.active){
      lines.push(`<b>罠:</b> 自分の罠あり（表示オフ）`);
    } else {
      lines.push('<b>罠:</b> 不明（未公開）');
    }
  } else {
    lines.push('<b>罠:</b> なし');
  }
  const myTarget = state.players[state.active] && state.players[state.active].target;
  if(myTarget && myTarget.r===r && myTarget.c===c) lines.push('<b>自分の的:</b> ここです');
  state.cellInfo = {r,c,lines};
  render();
}

function renderTargetPick(){

function renderPlacePiece(){
  const pl = state.players[state.piecePlacer];
  const chips = Object.entries(PIECE_TYPES).map(([key,def])=>{
    const remaining = pl.piecesRemaining[key]; const activeCls = state.pendingPieceType===key?'active':'';

  }).join('');
  return `<div class="gate"><h2 style="margin-bottom:2px;" class="${state.piecePlacer===1?'pill p1':'pill p2'}">${ownerLabel(state.piecePlacer)}が駒を配置</h2>
    <p class="muted">種類を選んで自陣内のマスをタップ（的の列＝一番奥の列には置けません）。同じ種類は連続で置けます。6個すべて置き終えると相手の番になります。</p>

function renderPlaceTrap(){
  const pl = state.players[state.trapPlacer];
  const chips = Object.entries(TRAP_TYPES).map(([key,def])=>{
    const activeCls = state.pendingTrapType===key?'active':'';
    return `<button class="type-chip ${activeCls}" data-action="set-trap-type" data-type="${key}"><b>${def.badge}</b><span>${def.label}</span></button>`;
  }).join('');
  return `<div class="gate"><h2 style="margin-bottom:2px;" class="${state.trapPlacer===1?'pill p1':'pill p2'}">${ownerLabel(state.trapPlacer)}が罠を配置</h2>
    <p class="muted">残り ${10-pl.trapsPlaced} 個。的の列（一番奥）には置けません。同じ種類は連続で置けます。</p><div class="type-picker">${chips}</div>
    ${state.pendingTrapType==='info' ? `<p class="muted tiny" style="max-width:360px;">情報罠は発動時に「踏んだ駒の種類・伏せ札1枚・枚数情報」を自動公開します。メモは任意です。</p>
    <input class="btn ghost tiny" style="text-align:center;max-width:260px;" placeholder="任意メモ" oninput="state.pendingTrapNote=this.value">` : ''}
    ${renderBoard('place-trap')}${renderSetupHand(state.trapPlacer)}</div>`;
